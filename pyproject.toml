[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-carry"
version = "0.1.0"
description = "MOEX cash-and-carry analytics, signals, and backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "requests>=2.31",
  "pandas>=2.1",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "dash>=2.16",
  "plotly>=5.20",
  "python-dateutil>=2.8",
]

[project.scripts]
moex-carry = "moex_carry.cli:main"
moex-carry-server = "moex_carry.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "responses>=0.25",
  "ruff>=0.9",
]
news = [
  "feedparser>=6.0",
  "trafilatura>=1.8",
  "beautifulsoup4>=4.12",
  "dateparser>=1.2",
  "transformers>=4.45",
  "tokenizers>=0.20",
  "datasets>=2.21",
  "scikit-learn>=1.5",
]
market = [
  "yfinance>=0.2",
]
perf = [
  "onnxruntime>=1.19",
  "optimum>=1.22",
]
obs = []
all = [
  "feedparser>=6.0",
  "trafilatura>=1.8",
  "beautifulsoup4>=4.12",
  "dateparser>=1.2",
  "transformers>=4.45",
  "tokenizers>=0.20",
  "datasets>=2.21",
  "scikit-learn>=1.5",
  "yfinance>=0.2",
  "onnxruntime>=1.19",
  "optimum>=1.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
