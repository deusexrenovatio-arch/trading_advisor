version: 1
dimensions:
  - id: reliability
    threshold: 1.0
    checks:
      - id: architecture-policy
        command: ["{python}", "scripts/validate_architecture_policy.py"]
      - id: plans-schema
        command: ["{python}", "scripts/validate_plans.py"]

  - id: trajectory
    threshold: 1.0
    checks:
      - id: v2-signals-idempotency
        command:
          [
            "{python}",
            "-m",
            "pytest",
            "-q",
            "tests/test_api_v2.py::test_v2_signals_active_and_actions_idempotency",
          ]
      - id: v2-decision-actions
        command:
          [
            "{python}",
            "-m",
            "pytest",
            "-q",
            "tests/test_api_v2.py::test_v2_decision_actions_and_v1_adapter",
          ]

  - id: context-budget
    threshold: 1.0
    checks:
      - id: handoff-budget
        command: ["{python}", "scripts/validate_session_handoff.py"]

  - id: security
    threshold: 1.0
    checks:
      - id: secrets-scan
        command: ["{python}", "scripts/scan_secrets.py"]
      - id: python-pip-health
        command: ["{python}", "-m", "pip", "check"]

  - id: frontend
    threshold: 1.0
    checks:
      - id: frontend-gate-contract
        command: ["{python}", "scripts/validate_frontend_gate_contract.py"]

  - id: design
    threshold: 1.0
    checks:
      - id: design-standards-contract
        command: ["{python}", "scripts/validate_design_contract.py"]

  - id: engineering-taste
    threshold: 1.0
    checks:
      - id: taste-invariants
        command: ["{python}", "scripts/validate_taste_invariants.py"]
      - id: python-style
        command: ["{python}", "scripts/validate_python_style.py"]
      - id: structured-logging-contract
        command: ["{python}", "scripts/validate_structured_logging.py"]
      - id: remediation-guidance
        command: ["{python}", "scripts/validate_governance_remediation.py"]

  - id: product-sense
    threshold: 1.0
    checks:
      - id: user-needs-catalog
        command: ["{python}", "scripts/validate_user_needs_catalog.py"]
      - id: acceptance-mapping
        command: ["{python}", "scripts/validate_test_cases.py"]

  - id: delivery-throughput
    threshold: 1.0
    checks:
      - id: codeowners-routing
        command: ["{python}", "scripts/validate_codeowners.py"]
      - id: flaky-policy
        command: ["{python}", "scripts/validate_flaky_policy.py"]
      - id: dependency-adr-policy
        command: ["{python}", "scripts/validate_dependency_decisions.py"]

  - id: observability
    threshold: 1.0
    checks:
      - id: local-observability-stack
        command: ["{python}", "scripts/validate_observability_stack.py"]
