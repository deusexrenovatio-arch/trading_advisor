  force_exit_policy: "next_anchor"
  force_exit_penalty_bps: 0.0
  annual_target_threshold: null
  r_cb_annual: null
  r_fund_annual: 0.0
  r_disc_annual: null
  slip_stock_bps: 0.0
  slip_fut_bps: 0.0
  slip_fut_ticks: null
  tick_size_fut: null
  fee_stock_per_share: null
  fee_stock_bps: null
  fee_fut_per_contract: null
  floor_tolerance: 0.0
  riskbuffer_floor: 0.0
  capital_base_mode: "FULL_CASH"
  margin_stock_pct: 0.0
  margin_fut_pct: 0.0
  var_margin_buffer_pct: 0.0
  max_spread_bps_stock: null
  max_spread_bps_fut: null
  min_avg_dollarvol_stock: null
  min_avg_dollarvol_fut: null
  min_open_interest: null
  require_live_orderbook_for_entry: false
  min_orderbook_depth_stock: null
  min_orderbook_depth_fut: null
  max_orderbook_age_sec_stock: null
  max_orderbook_age_sec_fut: null
  max_orderbook_imbalance_ratio_stock: null
  max_orderbook_imbalance_ratio_fut: null
  participation_rate: 0.1
  max_days_to_exit: null
  min_DTE_entry: 7
  close_buffer_days: 3
  roll_trigger_days: 0
  H_max_days: 20
  TP_pct: 0.01
  SL_pct: 0.01
  z_window: 60
  z_entry_threshold: null
  entry_price_tolerance_pct: 0.02
  entry_stock_tolerance_pct: 0.02
  entry_future_tolerance_pct: 0.025
  entry_spread_tolerance_pct: 0.03
  signal_cutoff_before_day_end_minutes: 0
  max_gross_notional: null
  max_contracts_per_pair: 1
  capital_allocated_per_trade: null
  margin_proxy: 1.0
  w1: 1.0
  w2: 1.0
  w3: 1.0
  w4: 1.0
  c1: 1.0
  c2: 1.0
  k_event: 0.0
  min_floor_score: null
  min_alpha_score: null
  min_total_score: null
  ranking_primary_metric: "avg_trade_return_annual_operational_recent"
  allowed_expiry_months: [3, 6, 9, 12]
  allowed_expiry_years: [2026]

aggregation:
  weights:
    fundamental: 0.4
    speculative: 0.3
    arbitrage: 0.3
  min_confidence: 0.2
  max_signals: 3
  rebalance_cadence: "weekly"
  rebalance_threshold_pct: 0.02
  max_turnover_pct: 0.2
  min_trade_weight: 0.01
  cooldown_days: 3

ui:
  host: "127.0.0.1"
  port: 8050
  signal_refresh_enabled: true
  signal_refresh_interval_sec: 60
  signal_refresh_daily_time: null
  signal_refresh_timezone: null
  signal_refresh_max_pairs: 1000
  signal_refresh_save_csv: true
  incremental_replay_enabled: true
  incremental_overlap_minutes: 180
  incremental_checkpoint_dir: "./data/state/incremental_replay"
  incremental_checkpoint_interval_minutes: 60
  pretrade_fail_open_on_transport_error: true
  ff_db_projection_source: false
  ff_fail_closed_execution: false
  auto_unwind_timeout_sec: 600
  use_unified_signal_engine: true
  unified_allow_legacy_fallback: true
  unified_snapshot_ttl_sec: 120
  unified_pair_workers: null
  unified_pair_replay_cache_max: 64
  unified_front_only: true
  unified_front_roll_days: 7
  require_score_gate_by_default: true
  require_score_gate_top_pairs_by_default: false
  max_api_payload_bytes: 262144

telegram:
  enabled: false
  bot_token: null
  backend_base_url: "http://127.0.0.1:8050"
  allowed_user_ids: []
  poll_timeout_sec: 25
  signal_fetch_interval_sec: 30
  hold_open_daily_limit: 1
  callback_ttl_hours: 72
  daily_healthcheck_enabled: true
  daily_healthcheck_time_local: "09:00"
  state_path: "./data/telegram/bot_state.json"
  ui_base_url: null

data:
  data_dir: "./data"
  compute_lookback_days: 120
  backtest_lookback_days: 365

environment:
  mode: "paper"
  venue: "MOEX"
  timezone: "Europe/Moscow"

risk_profile:
  account_equity: 1000000
  account_currency: "RUB"
  max_risk_per_trade_pct: 0.5
  max_daily_loss_pct: 2.0
  max_open_risk_pct: 1.5
  max_leverage: 3
  max_margin_pct: 60
  max_contracts_per_instrument: 10
  max_positions: 6
  max_correlated_exposure_pct: 40
  stop_loss_required: true
  time_stop_minutes: 90
  slippage_tolerance_ticks: 2

news_filter:
  lookback_minutes: 180
  block_severity_threshold: "high"
  reduce_severity_threshold: "medium"
  sources:
    - "trusted-feed"

signal_engine:
  data:
    bar_interval_sec: 60
    timezone: "Europe/Moscow"
    iss:
      page_size: 100
      retry:
        max_attempts: 5
        base_backoff_ms: 200
        max_backoff_ms: 5000
  features:
    atr:
      period: 14
      timeframe_sec: 300
    realized_vol:
      window_bars: 60
    vwap:
      use_typical_price: true
      reset: "session_start"
    zscore:
      window_bars: 60
    rel_volume:
      window_bars: 60
  regimes:
    volatility:
      lookback_days: 20
      high_quantile: 0.60
      low_quantile: 0.40
    liquidity:
      max_spread_ticks: 2
      min_depth_lots: 50
      vacuum:
        spread_ticks: 4
        depth_lots: 20
  strategies:
    orb:
      opening_range_min: 15
      buffer_atr_mult: 0.10
      buffer_ticks_min: 1
      tp_atr_mult: 1.0
      sl_atr_mult: 0.7
      horizon_min: 90
      require_high_vol: true
    vwap_mr:
      z_enter: 2.0
      z_exit: 0.5
      sl_atr_mult: 0.8
      min_tp_ticks: 2
      horizon_min: 45
    micro_momo:
      ema_fast: 9
      ema_slow: 21
      rel_volume_min: 1.2
      tp_atr_mult: 0.8
      sl_atr_mult: 0.6
      horizon_min: 60
  labeling:
    triple_barrier:
      on_same_bar_tp_sl: "worst_case"
      price_source: "ohlc"
  probability:
    method: "dirichlet_decay_v1"
    dirichlet_alpha: [1.0, 1.0, 1.0]
    decay_half_life_days: 30
    tier_thresholds:
      mid: 100
      high: 500
    calibration:
      method: "binning_ovr_renorm"
      bins: 15
      min_bin_count: 30
      smoothing_alpha: 1.0
  cost:
    model: "ticks_v1"
    commission_ticks_per_side: 0.5
    slippage_ticks_per_side: 1.0
    spread_half_ticks_fallback: 1.0
    liquidity_penalty:
      enable: true
      depth_ref_lots: 100
      max_penalty_ticks: 2.0
  gate:
    forbid_windows_min: 5
    min_expected_return_ticks: 1.0
  runtime_adapter:
    enabled: false
    override_signal_fields: true
    synthetic_history_cap: 2000
  morning_plan:
    timezone: "Europe/Moscow"
    calendar:
      sessions:
        - {start: "10:00", end: "14:00"}
        - {start: "14:05", end: "18:50"}
        - {start: "19:05", end: "23:50"}
      clearing_windows:
        - {start: "14:00", end: "14:05"}
        - {start: "18:50", end: "19:05"}
      forbid_new_positions_margin_min: 5
      entry_expiry_policy: "EOD_BEFORE_EVENING_CLEARING"
    data:
      d1_limit: 200
      h1_limit: 300
      m5_limit: 300
    regime:
      d1:
        ema_fast: 20
        ema_slow: 50
        adx_period: 14
        er_period: 20
        dir_band_atr_mult: 0.25
        adx_trend_min: 25
        adx_range_max: 18
        er_trend_min: 0.30
        er_range_max: 0.20
        atr_period: 14
        atr_rank_lookback: 60
        vol_high_pct: 0.70
        vol_low_pct: 0.30
      h1:
        ema_fast: 20
        ema_slow: 50
        atr_period: 14
        dir_band_atr_mult: 0.20
      liquidity:
        use_orderbook_if_available: true
        spread_thin_ticks: 2
        spread_vacuum_ticks: 4
        depth_thin_lots: 50
        depth_vacuum_lots: 20
    levels:
      merge_distance_ticks: 2
      d1:
        donchian_period: 20
        pivots: true
      h1:
        swing_k: 2
        max_swings_each_side: 8
        box_hours: 6
        box_range_atr_mult: 1.2
        include_ema20_level: true
    execution:
      m5_atr_period: 14
      buffer_atr_mult: 0.10
      buffer_min_ticks: 1
      limit_slip_ticks: 2
      noise_warn_high: 2.5
      noise_warn_low: 0.4
      swing_k: 2
    setups:
      mode: "trend_first"
      max_setups_per_instrument: 2
      require_vol_not_low: true
      pullback_max_dist_atr_mult: 1.0
      rr_default: 1.6
      min_target_ticks: 3
      max_risk_atr_mult: 1.2
      sl_atr_mult: 0.8
      qty_lots: 1
      horizon: "EOD"
      entry_tif: "GTT"
      entry_expiry_policy: "EOD_BEFORE_EVENING_CLEARING"
      entry_zone_offset_ticks: 0
      enable_cost_net_gate: true
      estimated_round_trip_cost_ticks: 5.0
      min_reward_net_ticks: 2.0
      min_rr_net: 1.1
      min_reward_gross_ticks: 10.0
