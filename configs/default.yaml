moex:
  base_url: "https://iss.moex.com"
  fallback_ips:
    - "85.118.181.8"
  force_fallback: true
  engine_shares: "stock"
  market_shares: "shares"
  shares_board: "TQBR"
  engine_futures: "futures"
  market_futures: "forts"
  futures_board: "RFUD"
  request_timeout_sec: 20
  request_max_retries: 3
  request_retry_backoff_sec: 0.5
  request_retry_max_backoff_sec: 4.0

cbr:
  base_url: "https://www.cbr.ru"
  key_rate_path: "/Queries/UniDbQuery/DownloadExcel/132934"

database:
  url: "sqlite:///./data/moex_carry.db"
  echo: false

costs:
  stock_commission_bps: 1.5
  futures_commission_bps: 1.0
  exchange_fee_bps: 0.5
  slippage_bps: 0.5

taxes:
  profit_tax_rate: 0.13
  dividend_tax_rate: 0.13

strategy:
  z_window: 60
  z_min_window: 10
  z_entry: 2.0
  z_exit: 0.5
  implied_rate_buffer: 0.005
  min_days_to_expiry: 7
  min_days_to_exdiv: 5
  term_premium_base: 0.01
  term_premium_slope: 0.02
  max_pairs: 25
  intraday_marketdata: true

spread_carry_alpha:
  day_count: "ACT/365"
  use_trading_days: false
  price_source: "common_minute_close"
  common_minute_anchor: "last"
  signal_exec_lag_days: 0
  execution_lag_minutes: 30
  execution_max_wait_minutes: 360
  force_exit_policy: "next_anchor"
  force_exit_penalty_bps: 0.0
  annual_target_threshold: null
  r_cb_annual: null
  r_fund_annual: 0.0
  r_disc_annual: null
  slip_stock_bps: 0.0
  slip_fut_bps: 0.0
  slip_fut_ticks: null
  tick_size_fut: null
  fee_stock_per_share: null
  fee_stock_bps: null
  fee_fut_per_contract: null
  floor_tolerance: 0.0
  riskbuffer_floor: 0.0
  capital_base_mode: "FULL_CASH"
  margin_stock_pct: 0.0
  margin_fut_pct: 0.0
  var_margin_buffer_pct: 0.0
  max_spread_bps_stock: null
  max_spread_bps_fut: null
  min_avg_dollarvol_stock: null
  min_avg_dollarvol_fut: null
  min_open_interest: null
  require_live_orderbook_for_entry: false
  min_orderbook_depth_stock: null
  min_orderbook_depth_fut: null
  max_orderbook_age_sec_stock: null
  max_orderbook_age_sec_fut: null
  max_orderbook_imbalance_ratio_stock: null
  max_orderbook_imbalance_ratio_fut: null
  participation_rate: 0.1
  max_days_to_exit: null
  min_DTE_entry: 7
  close_buffer_days: 3
  roll_trigger_days: 0
  H_max_days: 20
  TP_pct: 0.01
  SL_pct: 0.01
  z_window: 60
  z_entry_threshold: null
  entry_price_tolerance_pct: 0.02
  entry_stock_tolerance_pct: 0.02
  entry_future_tolerance_pct: 0.025
  entry_spread_tolerance_pct: 0.03
  signal_cutoff_before_day_end_minutes: 0
  max_gross_notional: null
  max_contracts_per_pair: 1
  capital_allocated_per_trade: null
  margin_proxy: 1.0
  w1: 1.0
  w2: 1.0
  w3: 1.0
  w4: 1.0
  c1: 1.0
  c2: 1.0
  k_event: 0.0
  min_floor_score: null
  min_alpha_score: null
  min_total_score: null
  ranking_primary_metric: "avg_trade_return_annual_operational_recent"
  allowed_expiry_months: [3, 6, 9, 12]
  allowed_expiry_years: [2026]

aggregation:
  weights:
    fundamental: 0.4
    speculative: 0.3
    arbitrage: 0.3
  min_confidence: 0.2
  max_signals: 3
  rebalance_cadence: "weekly"
  rebalance_threshold_pct: 0.02
  max_turnover_pct: 0.2
  min_trade_weight: 0.01
  cooldown_days: 3

ui:
  host: "127.0.0.1"
  port: 8050
  signal_refresh_enabled: true
  signal_refresh_interval_sec: 60
  signal_refresh_daily_time: null
  signal_refresh_timezone: null
  signal_refresh_max_pairs: 1000
  signal_refresh_save_csv: true
  incremental_replay_enabled: true
  incremental_overlap_minutes: 180
  incremental_checkpoint_dir: "./data/state/incremental_replay"
  incremental_checkpoint_interval_minutes: 60
  pretrade_fail_open_on_transport_error: true
  ff_db_projection_source: false
  ff_fail_closed_execution: false
  ff_news_bridge_enabled: false
  ff_news_model_advisory_enabled: false
  ff_news_model_decision_weight_enabled: false
  auto_unwind_timeout_sec: 600
  use_unified_signal_engine: true
  unified_allow_legacy_fallback: true
  unified_snapshot_ttl_sec: 120
  unified_pair_workers: null
  unified_front_only: true
  unified_front_roll_days: 7
  require_score_gate_by_default: true
  require_score_gate_top_pairs_by_default: false

telegram:
  enabled: false
  bot_token: null
  backend_base_url: "http://127.0.0.1:8050"
  allowed_user_ids: []
  poll_timeout_sec: 25
  signal_fetch_interval_sec: 30
  hold_open_daily_limit: 1
  callback_ttl_hours: 72
  daily_healthcheck_enabled: true
  daily_healthcheck_time_local: "09:00"
  state_path: "./data/telegram/bot_state.json"
  ui_base_url: null

data:
  data_dir: "./data"
  compute_lookback_days: 120
  backtest_lookback_days: 365

environment:
  mode: "paper"
  venue: "MOEX"
  timezone: "Europe/Moscow"

risk_profile:
  account_equity: 1000000
  account_currency: "RUB"
  max_risk_per_trade_pct: 0.5
  max_daily_loss_pct: 2.0
  max_open_risk_pct: 1.5
  max_leverage: 3
  max_margin_pct: 60
  max_contracts_per_instrument: 10
  max_positions: 6
  max_correlated_exposure_pct: 40
  stop_loss_required: true
  time_stop_minutes: 90
  slippage_tolerance_ticks: 2

news_filter:
  lookback_minutes: 180
  block_severity_threshold: "high"
  reduce_severity_threshold: "medium"
  sources:
    - "trusted-feed"

news_ingest:
  enabled: false
  rss_urls:
    - "https://news.google.com/rss/search?q=commodities+futures+market"
  max_items_per_run: 100
  gdelt_enabled: true
  gdelt_max_records_per_call: 250
  gdelt_min_request_interval_sec: 5.2
  gdelt_request_timeout_sec: 40
  backfill_start_date: "2018-01-01"
  backfill_chunk_days: 7
  backfill_max_windows_per_commodity: 0
  qc_min_news_per_ticker: 500
  qc_min_price_points_per_ticker: 500
  commodity_profiles:
    - ticker: "BRN"
      name: "Brent Crude Oil"
      gdelt_query: "(\"brent crude\" OR \"brent oil\" OR \"ice brent\")"
      rss_urls:
        - "https://news.google.com/rss/search?q=Brent+crude+oil+futures"
      price_source: "yfinance"
      price_symbol: "BZ=F"
      price_interval: "1d"
    - ticker: "GOLD"
      name: "Gold"
      gdelt_query: "(\"gold futures\" OR \"gold price\" OR bullion)"
      rss_urls:
        - "https://news.google.com/rss/search?q=gold+futures"
      price_source: "yfinance"
      price_symbol: "GC=F"
      price_interval: "1d"
    - ticker: "NG_US"
      name: "US Natural Gas"
      gdelt_query: "(\"natural gas\" OR \"henry hub\" OR \"nymex gas\")"
      rss_urls:
        - "https://news.google.com/rss/search?q=henry+hub+natural+gas+futures"
      price_source: "yfinance"
      price_symbol: "NG=F"
      price_interval: "1d"

news_models:
  enabled_models: ["finbert", "nli"]
  primary_model: "finbert"
  finbert_model_name: "ProsusAI/finbert"
  nli_model_name: "facebook/bart-large-mnli"
  multilingual_nli_model_name: "MoritzLaurer/mDeBERTa-v3-base-mnli-xnli"
  model_version: "v1"
  inference_batch_size: 16
  inference_text_max_chars: 2000
  inference_thread_cap: 0
  calibration_mode: "none"
  calibration_min_train_samples: 30
  epsilon_default: 0.0005
  horizons: ["5m", "1h", "4h", "1d", "5d"]
  promotion_min_accuracy: 0.70
  promotion_min_coverage: 0.20
  promotion_max_brier: 0.25
  promotion_min_sample_count: 30
  promotion_min_ticker_stability: 0.55
  decision_weight_rollout_mode: "limited"
  decision_weight_min_sample_size: 3
  decision_weight_limited_max_deviation: 0.25
  decision_weight_signal_threshold: 0.12
  decision_weight_min_impact: 0.6
  decision_weight_reduce_factor: 0.5
  decision_weight_boost_factor: 1.1

news_events:
  enabled: true
  cluster_version: "det-v1"
  cluster_window_hours: 48
  similarity_threshold: 0.35
  resolve_after_hours: 72

news_llm:
  enabled: false
  full_pass_enabled: false
  provider: "openai"
  model_id: "gpt-5-mini"
  api_base_url: "https://api.openai.com/v1"
  api_key_env: "OPENAI_API_KEY"
  prompt_version: "news-v1"
  label_version: "v1"
  max_items_per_run: 50
  max_input_chars: 6000
  max_output_tokens: 512
  max_calls_per_run: 0
  max_prompt_tokens_per_run: 0
  max_completion_tokens_per_run: 0
  max_total_tokens_per_run: 0
  request_timeout_sec: 45
  max_retries: 2
  retry_backoff_sec: 1.5
  temperature: 0.0
  top_impact_priority: true
  min_impact_for_priority: 0.0

