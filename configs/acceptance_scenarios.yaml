version: 1
scenarios:
  - id: dev-skill-start-gate
    type: manual
    scope: process
    test_cases: [TC-DEV-WF-001]
    title: Development start skill gate
    user_story: Engineer starts any new development stream with mandatory bootstrap skill sequence.
    expectations:
      - "parallel-worktree-flow is invoked first for new streams."
      - "Domain skill flow is selected before coding starts."

  - id: dev-skill-recheck-gate
    type: manual
    scope: process
    test_cases: [TC-DEV-WF-002]
    title: Development recheck skill gate
    user_story: Engineer reruns flow-specific verification skills before closing the task.
    expectations:
      - "Active flow verification skill is rerun after fixes."
      - "Required checks from docs/DEV_WORKFLOW.md are executed on recheck."

  - id: dev-skill-prepush-gate
    type: manual
    scope: process
    test_cases: [TC-DEV-WF-003]
    title: Development pre-push skill gate
    user_story: Engineer performs mandatory checks before pushing branch updates.
    expectations:
      - "Backend, frontend, and docs checks from docs/DEV_WORKFLOW.md pass."
      - "Any failed check blocks push until fixed."

  - id: decision-view
    type: api_list
    scope: backend
    url: /api/v2/decisions/view?limit=5
    require_non_empty: false
    required_keys: [decision_id, created_at, action, risk_state, decision_ref, execution_ref, projection_source]
    test_cases: [TC-DEC-API-001, TC-DEC-UI-001]
    title: Просмотр решений
    user_story: Пользователь видит таблицу решений и может выбрать строку.
    expectations:
      - В списке есть идентификатор решения и время.
      - Видны action и risk_state для быстрой оценки.
  - id: decision-view-filters
    type: api_list
    scope: backend
    url: /api/v2/decisions/view?limit=5&strategy_type=arbitrage&primary_instrument=stock&risk_state=green&news_severity=low&created_from=2026-01-01&created_to=2026-12-31
    allow_empty: true
    required_keys: [decision_id]
    test_cases: [TC-DEC-API-005]
    title: Decision view server filters
    user_story: Operator can request filtered decisions by strategy, instrument, risk, news, and date.
    expectations:
      - Response returns a JSON array (may be empty).

  - id: decision-view-aggregation
    type: api_list
    scope: backend
    url: /api/v2/decisions/view?limit=1
    require_non_empty: false
    required_keys: [aggregation_summary]
    test_cases: [TC-DEC-API-002]
    title: Агрегация в decision_view
    user_story: Пользователь видит суммарный результат агрегатора в таблице решений.
    expectations:
      - Поле aggregation_summary присутствует в decision_view.
  - id: decision-log-aggregation
    type: decision_log_detail
    scope: backend
    source_url: /api/v2/decisions/view?limit=1
    url_template: /api/decision-log/{decision_id}
    required_keys: [strategy_signals, aggregation]
    test_cases: [TC-DEC-API-003]
    title: Агрегация в decision_log
    user_story: Пользователь может открыть подробную запись с результатами агрегатора.
    expectations:
      - В decision_log присутствуют strategy_signals и aggregation.
  - id: decision-action
    type: decision_action
    scope: backend
    source_url: /api/v2/decisions/view?limit=1
    url_template: /api/v2/decisions/{decision_id}/actions
    payload:
      action: EXECUTE
      actor_id: acceptance
      reason_code: acceptance
      comment: acceptance
      idempotency_key: acceptance-decision-action-v2
    required_keys: [status, operator_action, execution_status]
    test_cases: [TC-DEC-API-004, TC-DEC-UI-002]
    title: Операторское решение
    user_story: Пользователь подтверждает или отклоняет решение и инициирует выполнение.
    expectations:
      - API принимает approve/reject и возвращает статус ok.
  - id: params-specs
    type: api_list
    scope: backend
    url: /api/params/specs
    require_non_empty: true
    required_keys: [key, value_type, default]
    test_cases: [TC-PARAMS-API-001]
    title: Strategy parameter specs
    user_story: Operator can review available configuration parameters.
  - id: frontend-params-specs
    type: api_list
    scope: frontend
    url: /api/params/specs
    require_non_empty: true
    required_keys: [key, value_type, default]
    test_cases: [TC-BACK-V2-UI-001, TC-BACK-V2-UI-002]
    title: Frontend params specs proxy
    user_story: UI can load parameter specs for Backtest v2.
  - id: frontend-hpo-run
    type: post_json
    scope: frontend
    url: /api/hpo/run
    payload:
      base:
        test:
          start_date: 2020-01-01
          end_date: 2020-12-31
        universe:
          max_pairs: 1
    skip_on_statuses: [400]
    skip_on_error_messages: ["Missing raw data"]
    required_keys: [status, run_id]
    test_cases: [TC-HPO-UI-001]
    title: Frontend HPO proxy
    user_story: UI can submit HPO runs via proxy.
  - id: top-pairs
    type: api_list
    scope: backend
    url: /api/v2/top-pairs?limit=5
    require_non_empty: false
    required_keys:
      [
        stock,
        future,
        spot,
        future_price,
        spread_pct,
        rtc_pct,
        floor_rate_annual,
        score_floor,
        avg_trade_return_annual_recent,
        total_score,
        decision
      ]
    cache_as: top_pairs
    test_cases: [TC-TOP-API-001, TC-TOP-API-002, TC-TOP-UI-001, TC-TOP-UI-002, TC-TOP-UI-003, TC-TOP-UI-004]
    title: Top pairs table (floor + alpha)
    user_story: Operator reviews ranked pairs with floor + alpha metrics.
    expectations:
      - Ranking uses total_score for ordering.
      - Response supports optional `require_score_gate=true|false` filtering.
  - id: signals-active
    type: api_list
    scope: backend
    url: /api/v2/signals/active
    require_non_empty: false
    required_keys:
      [signal_id, run_id, timestamp, stock, future, signal_action, signal_score, lifecycle_state, signal_used, signal_used_at, signal_used_by, signal_details_pending]
    allowed_field_values:
      signal_action: [enter, exit, hold_open]
    test_cases: [TC-SIG-ACT-API-001, TC-SIG-ACT-API-002, TC-SIG-ACT-API-004, TC-SIG-ACT-API-005, TC-SIG-ACT-API-006, TC-SIG-CONTRACT-API-001, TC-SIG-ACT-UI-001, TC-SIG-PLAN-UI-001, TC-SIG-UI-WORKFLOW-001, TC-SIG-ACK-UI-001, TC-TG-UI-002, TC-TG-UI-003, TC-TG-WRK-002, TC-TG-WRK-003, TC-TG-WRK-005, TC-TG-WRK-006, TC-TG-WRK-007, TC-TG-WRK-008]
    title: Active signals
    user_story: User receives only actionable signals.
    expectations:
      - Action includes only enter/exit/hold_open.
      - Signal includes pair identifiers and score.
  - id: signals-action-v2
    type: signal_action
    scope: backend
    active_url: /api/v2/signals/active?limit=5
    url_template: /api/v2/signals/{signal_id}/actions
    allow_empty: true
    expected_http_statuses: [200]
    payload:
      action: ack
      source: ui
      actor_id: acceptance
      idempotency_key: acceptance-signals-action-v2
    required_keys: [status, signal_id, action, entity_ref, fail_closed]
    allowed_response_status: [ok, duplicate]
    test_cases: [TC-SIG-ACT-API-003]
    title: Signal actions v2 from active feed
    user_story: Operator acknowledges an active signal through the v2 action API.
    expectations:
      - Scenario resolves signal_id from active feed and sends an action.
      - Response contains status and action/audit references.
      - Telegram usage flags are present for each row.
  - id: signals-execute
    type: signal_action
    scope: backend
    active_url: /api/v2/signals/active?limit=5
    url_template: /api/v2/signals/{signal_id}/actions
    allow_empty: true
    expected_http_statuses: [200, 409]
    payload:
      action: enter
      source: ui
      actor_id: acceptance
      reason_code: acceptance_enter
      idempotency_key: acceptance-signals-enter-v2
      price: 100.5
      quantity: 1
      side: stock
      comment: acceptance
    required_keys: [status, signal_id, action, entity_ref, fail_closed]
    required_keys_by_status:
      ok: [execution_event_id]
      blocked: [reason_code, message]
    allowed_response_status: [ok, duplicate, blocked]
    test_cases: [TC-SIG-EXEC-API-001, TC-SIG-EXEC-API-002, TC-SIG-EXEC-API-003, TC-SIG-EXEC-UI-001, TC-SIG-EXEC-UI-002]
    title: Execute signal
    user_story: User can manually execute a signal and record the fact.
    expectations:
      - Scenario resolves signal_id from active feed and submits enter action to v2 endpoint.
      - Response returns status and execution references; blocked path includes explicit reason.
  - id: auto-unwind-policy-v2
    type: post_json
    scope: backend
    url: /api/v2/policies/auto-unwind/run
    payload:
      dry_run: true
      timeout_sec: 60
    required_keys: [status, policy, candidate_count, candidates]
    test_cases: [TC-SIG-POLICY-API-001]
    title: Auto-unwind policy run
    user_story: System evaluates stale leg imbalance candidates before forced close.
    expectations:
      - API returns summary with policy name and candidate counters.
      - Dry run does not write execution rows.
  - id: signals-ack-execute
    type: post_json
    scope: backend
    url: /api/signals/execute
    payload:
      stock: AAA
      future: AAH6
      direction: cash_and_carry
      action: ack
      note: "{}"
    required_keys: [status]
    test_cases: [TC-SIG-ACK-API-001, TC-SIG-ACK-UI-001, TC-TG-UI-001, TC-TG-WRK-001, TC-TG-WRK-004]
    title: Signal ACK via Telegram payload
    user_story: Operator confirms signal usage in Telegram and backend records ACK.
    expectations:
      - API accepts action=ack and returns status ok.
      - ACK defaults to `status=acknowledged` when status is omitted.
  - id: pretrade-check
    type: api_object
    scope: backend
    pair_source: top_pairs
    url_template: /api/pretrade/check?stock={stock}&future={future}&snapshots=1&min_hits=1&poll_sec=0
    allow_empty: true
    required_keys:
      [status, ready_to_place, reasons, order_price_bands, volume_requirements, gates, hits]
    test_cases: [TC-PRETRADE-API-001, TC-PRETRADE-API-002, TC-PRETRADE-UI-001]
    title: Delayed pre-trade readiness check
    user_story: Operator validates entry readiness for both legs before placing orders.
    expectations:
      - Response is a JSON object with status, reasons, and gate breakdown.
      - Includes order price bands and volume requirements for manual verification.
  - id: signals-history
    type: api_list
    scope: backend
    url: /api/v2/signals/history?limit=5
    require_non_empty: true
    required_keys:
      [run_id, timestamp, stock, future, signal_action, signal_direction, signal_score]
    allowed_field_values:
      signal_action: [enter, exit, hold]
    cache_as: signals_history
    test_cases: [TC-SIG-HIST-API-001, TC-SIG-HIST-API-003, TC-SIG-CONTRACT-API-001, TC-SIG-HIST-UI-001, TC-SIG-HIST-UI-002]
    title: История сигналов
    user_story: Пользователь видит историю сигналов за период.
    expectations:
      - История содержит action/direction/score.
      - Можно фильтровать по диапазону дат.
  - id: signals-history-reasons
    type: api_list
    scope: backend
    url: /api/v2/signals/history?limit=5
    require_non_empty: false
    required_keys: [signal_action, signal_reasons, signal_metrics]
    test_cases: [TC-SIG-HIST-API-004]
    title: Signal history includes reasons
    user_story: Operator can inspect exit reasons and metrics.
  - id: signals-history-range
    type: history_date_range
    scope: backend
    history_source: signals_history
    source_url: /api/v2/signals/history?limit=1
    url_template: /api/v2/signals/history?from={date_from}&to={date_to}
    required_keys: [timestamp, stock, future, signal_action]
    test_cases: [TC-SIG-HIST-API-002, TC-SIG-HIST-UI-001]
    title: Фильтр истории по датам
    user_story: Пользователь задаёт дату "с/по" и получает записи за этот день.
    expectations:
      - Диапазон дат включает весь день, а не только 00:00.
  - id: backtests
    type: api_list
    scope: backend
    url: /api/backtests?limit=5
    require_non_empty: false
    required_keys: [share_alpha_exits, avg_hold_days]
    test_cases: [TC-BACK-API-001, TC-BACK-UI-001]
    title: Метрики бэктеста
    user_story: Пользователь видит метрики бэктеста.
  - id: backtest-run
    type: backtest_run
    scope: backend
    url: /api/backtest/run
    source_url: /api/v2/top-pairs?limit=1
    allow_empty: true
    window_days: 60
    precompute: true
    required_keys: [summary_metrics, equity_curve, trades]
    test_cases: [TC-BACK-V2-API-001, TC-BACK-V2-API-002]
    title: Backtest v2 run
    user_story: ???????? ????????? Backtest v2 ????? API.
    expectations:
      - ????? ???????? summary_metrics, equity_curve ? trades.

  - id: forward-start
    type: post_json
    scope: backend
    url: /api/forward/start
    payload: {}
    skip_on_statuses: [400]
    skip_on_error_messages: ["Missing raw data"]
    required_keys: [run_id, status, state]
    test_cases: [TC-FWD-API-001]
    title: Forward start
    user_story: Оператор инициализирует forward-run.
    expectations:
      - Ответ содержит run_id и начальное состояние.
  - id: forward-status
    type: http_status
    scope: backend
    url: /api/forward/status
    skip_on_statuses: [400]
    skip_on_error_messages: ["no_active_run"]
    test_cases: [TC-FWD-API-002, TC-FWD-UI-001]
    title: Forward status
    user_story: Оператор проверяет статус forward-run.
    expectations:
      - Endpoint возвращает 200, когда forward-run активен.
  - id: hpo
    type: post_json
    scope: backend
    url: /api/hpo/run
    payload:
      base:
        test:
          start_date: 2020-01-01
          end_date: 2020-12-31
        universe:
          max_pairs: 1
    skip_on_statuses: [400]
    skip_on_error_messages: ["Missing raw data"]
    required_keys: [status, run_id]
    test_cases: [TC-HPO-API-001, TC-HPO-UNIT-001]
    title: HPO run
    user_story: Researcher starts an HPO run.
    expectations:
      - Response includes run_id and running status.
  - id: hpo-status
    type: http_status
    scope: backend
    url: /api/hpo/status
    skip_on_statuses: [400]
    skip_on_error_messages: ["no_active_run"]
    test_cases: [TC-HPO-API-002]
    title: HPO status
    user_story: Operator checks HPO run status.
    expectations:
      - Endpoint returns 200 after a run is started.
  - id: spread-series
    type: spread_series
    scope: backend
    allow_empty: true
    pair_source: top_pairs
    source_url: /api/v2/top-pairs?limit=1
    window_days: 60
    required_keys:
      - spread_mid
      - spread_pct
      - entry_flag
      - exit_flag
    test_cases: [TC-SPREAD-API-001, TC-SPREAD-UI-001, TC-SPREAD-UI-002]
    title: График спреда
    user_story: Пользователь видит данные для графика спреда.
  - id: news-feed-v2
    type: api_list
    scope: backend
    url: /api/v2/news/feed?limit=5
    allow_empty: true
    required_keys: [news_event_id, published_at, severity, headline]
    test_cases: [TC-NEWS-API-001, TC-NEWS-UI-001]
    title: News feed v2
    user_story: Operator reviews event feed with linked entities and severity.
    expectations:
      - Response is JSON array; rows include event id/time/severity/headline.
  - id: portfolio-rebalance-v2
    type: api_object
    scope: backend
    url: /api/v2/portfolio/rebalance/preview?limit=5
    allow_empty: true
    required_keys: [rebalance_plan_id, positions]
    test_cases: [TC-PORT-API-001, TC-PORT-UI-001]
    title: Portfolio rebalance preview v2
    user_story: Operator inspects rebalance proposals before commit.
    expectations:
      - Response is JSON object with plan id and positions list.
  - id: ops-health-v2
    type: api_object
    scope: backend
    url: /api/v2/ops/health
    required_keys: [status, timestamp, checks]
    test_cases: [TC-OPS-API-001]
    title: Ops health v2
    user_story: Operator checks service liveness/readiness before market actions.
    expectations:
      - Response includes global status and dependency checks.
  - id: ops-slo-v2
    type: api_object
    scope: backend
    url: /api/v2/ops/slo
    required_keys: [generated_at, slo_targets, api, events_15m, alerts]
    test_cases: [TC-OPS-API-002]
    title: Ops SLO snapshot v2
    user_story: Operator reviews latency/error SLO and alert flags.
    expectations:
      - Response includes endpoint metrics and 15-minute event counters.
  - id: frontend
    type: http_status
    scope: frontend
    url: /
    test_cases: [TC-FE-HTTP-001, TC-UI-DOMAIN-001, TC-UI-ROUTE-001, TC-UI-KPI-001]
    title: Доступность UI
    user_story: Пользователь может открыть UI.
  - id: frontend-proxy
    type: api_list
    scope: frontend
    url: /api/v2/top-pairs?limit=5
    require_non_empty: false
    test_cases: [TC-FE-PROXY-001]
    title: Прокси API
    user_story: UI получает данные через proxy.
  - id: unified-minute-runtime
    type: api_list
    scope: backend
    url: /api/top-pairs?limit=5
    require_non_empty: false
    required_keys: [stock, future, signal_action, signal_score]
    test_cases: [TC-UNI-API-001, TC-UNI-API-002, TC-UNI-API-003, TC-PERF-GATE-MAN-001, TC-PERF-ARCH-UNIT-001]
    title: Unified minute-first market runtime
    user_story: Backend market tables are served by unified minute replay runtime with compatibility fields.
    expectations:
      - Endpoints return compatible payloads for top-pairs/signals/backtests and support refresh via unified engine.
