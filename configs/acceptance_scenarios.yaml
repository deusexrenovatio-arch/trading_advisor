version: 1
scenarios:
  - id: decision-view
    type: api_list
    scope: backend
    url: /api/decision-view?limit=5
    require_non_empty: false
    required_keys: [decision_id, created_at, action, risk_state]
    test_cases: [TC-DEC-API-001, TC-DEC-UI-001]
    title: Просмотр решений
    user_story: Пользователь видит таблицу решений и может выбрать строку.
    expectations:
      - В списке есть идентификатор решения и время.
      - Видны action и risk_state для быстрой оценки.
  - id: decision-view-filters
    type: api_list
    scope: backend
    url: /api/decision-view?limit=5&strategy_type=arbitrage&primary_instrument=stock&risk_state=green&news_severity=low&created_from=2026-01-01&created_to=2026-12-31
    allow_empty: true
    required_keys: [decision_id]
    test_cases: [TC-DEC-API-005]
    title: Decision view server filters
    user_story: Operator can request filtered decisions by strategy, instrument, risk, news, and date.
    expectations:
      - Response returns a JSON array (may be empty).

  - id: decision-view-aggregation
    type: api_list
    scope: backend
    url: /api/decision-view?limit=1
    require_non_empty: false
    required_keys: [aggregation_summary]
    test_cases: [TC-DEC-API-002]
    title: Агрегация в decision_view
    user_story: Пользователь видит суммарный результат агрегатора в таблице решений.
    expectations:
      - Поле aggregation_summary присутствует в decision_view.
  - id: decision-log-aggregation
    type: decision_log_detail
    scope: backend
    source_url: /api/decision-view?limit=1
    url_template: /api/decision-log/{decision_id}
    required_keys: [strategy_signals, aggregation]
    test_cases: [TC-DEC-API-003]
    title: Агрегация в decision_log
    user_story: Пользователь может открыть подробную запись с результатами агрегатора.
    expectations:
      - В decision_log присутствуют strategy_signals и aggregation.
  - id: decision-action
    type: decision_action
    scope: backend
    source_url: /api/decision-view?limit=1
    url_template: /api/decisions/{decision_id}/action
    payload:
      action: approve
      note: acceptance
    required_keys: [status, operator_action, execution_status]
    test_cases: [TC-DEC-API-004, TC-DEC-UI-002]
    title: Операторское решение
    user_story: Пользователь подтверждает или отклоняет решение и инициирует выполнение.
    expectations:
      - API принимает approve/reject и возвращает статус ok.
  - id: params-specs
    type: api_list
    scope: backend
    url: /api/params/specs
    require_non_empty: true
    required_keys: [key, value_type, default]
    test_cases: [TC-PARAMS-API-001]
    title: Strategy parameter specs
    user_story: Operator can review available configuration parameters.
  - id: frontend-params-specs
    type: api_list
    scope: frontend
    url: /api/params/specs
    require_non_empty: true
    required_keys: [key, value_type, default]
    test_cases: [TC-BACK-V2-UI-001, TC-BACK-V2-UI-002]
    title: Frontend params specs proxy
    user_story: UI can load parameter specs for Backtest v2.
  - id: frontend-hpo-run
    type: post_json
    scope: frontend
    url: /api/hpo/run
    payload:
      base:
        test:
          start_date: 2020-01-01
          end_date: 2020-12-31
        universe:
          max_pairs: 1
    required_keys: [status, run_id]
    test_cases: [TC-HPO-UI-001]
    title: Frontend HPO proxy
    user_story: UI can submit HPO runs via proxy.
  - id: top-pairs
    type: api_list
    scope: backend
    url: /api/top-pairs?limit=5
    require_non_empty: false
    required_keys:
      [
        stock,
        future,
        spot,
        future_price,
        spread_pct,
        rtc_pct,
        floor_rate_annual,
        score_floor,
        avg_trade_return_annual_recent,
        total_score,
        decision
      ]
    forbid_keys: [signal_reasons, signal_metrics]
    cache_as: top_pairs
    test_cases: [TC-TOP-API-001, TC-TOP-UI-001, TC-TOP-UI-002, TC-TOP-UI-003, TC-TOP-UI-004]
    title: Top pairs table (floor + alpha)
    user_story: Operator reviews ranked pairs with floor + alpha metrics.
    expectations:
      - Ranking uses total_score for ordering.
      - Response excludes signal_reasons and signal_metrics.
  - id: signals-active
    type: api_list
    scope: backend
    url: /api/signals/active
    require_non_empty: false
    required_keys: [run_id, timestamp, stock, future, signal_action, signal_score]
    allowed_field_values:
      signal_action: [enter, exit, hold_open]
    test_cases: [TC-SIG-ACT-API-001, TC-SIG-ACT-UI-001, TC-SIG-PLAN-UI-001]
    title: Active signals
    user_story: User receives only actionable signals.
    expectations:
      - Action includes only enter/exit.
      - Signal includes pair identifiers and score.
  - id: signals-execute
    type: post_json
    scope: backend
    url: /api/signals/execute
    payload:
      stock: AAA
      future: AAH6
      direction: cash_and_carry
      action: enter
      price: 100.5
      quantity: 1
      side: stock
      note: acceptance
    required_keys: [status, order_id]
    test_cases: [TC-SIG-EXEC-API-001, TC-SIG-EXEC-UI-001, TC-SIG-EXEC-UI-002]
    title: Execute signal
    user_story: User can manually execute a signal and record the fact.
    expectations:
      - API accepts payload and returns status ok.
      - order_id is returned for side=stock|future to link legs of one order.
  - id: pretrade-check
    type: api_object
    scope: backend
    pair_source: top_pairs
    url_template: /api/pretrade/check?stock={stock}&future={future}&snapshots=1&min_hits=1&poll_sec=0
    allow_empty: true
    required_keys:
      [status, ready_to_place, reasons, order_price_bands, volume_requirements, gates, hits]
    test_cases: [TC-PRETRADE-API-001, TC-PRETRADE-UI-001]
    title: Delayed pre-trade readiness check
    user_story: Operator validates entry readiness for both legs before placing orders.
    expectations:
      - Response is a JSON object with status, reasons, and gate breakdown.
      - Includes order price bands and volume requirements for manual verification.
  - id: signals-history
    type: api_list
    scope: backend
    url: /api/signals/history?limit=5
    require_non_empty: true
    required_keys:
      [run_id, timestamp, stock, future, signal_action, signal_direction, signal_score]
    allowed_field_values:
      signal_action: [enter, exit, hold]
    cache_as: signals_history
    test_cases: [TC-SIG-HIST-API-001, TC-SIG-HIST-API-003, TC-SIG-HIST-UI-001, TC-SIG-HIST-UI-002]
    title: История сигналов
    user_story: Пользователь видит историю сигналов за период.
    expectations:
      - История содержит action/direction/score.
      - Можно фильтровать по диапазону дат.
  - id: signals-history-reasons
    type: api_list
    scope: backend
    url: /api/signals/history?limit=5
    require_non_empty: false
    required_keys: [signal_action, signal_reasons, signal_metrics]
    test_cases: [TC-SIG-HIST-API-004]
    title: Signal history includes reasons
    user_story: Operator can inspect exit reasons and metrics.
  - id: signals-history-range
    type: history_date_range
    scope: backend
    history_source: signals_history
    required_keys: [timestamp, stock, future, signal_action]
    test_cases: [TC-SIG-HIST-API-002, TC-SIG-HIST-UI-001]
    title: Фильтр истории по датам
    user_story: Пользователь задаёт дату "с/по" и получает записи за этот день.
    expectations:
      - Диапазон дат включает весь день, а не только 00:00.
  - id: backtests
    type: api_list
    scope: backend
    url: /api/backtests?limit=5
    require_non_empty: false
    required_keys: [share_alpha_exits, avg_hold_days]
    test_cases: [TC-BACK-API-001, TC-BACK-UI-001]
    title: Метрики бэктеста
    user_story: Пользователь видит метрики бэктеста.
  - id: backtest-run
    type: backtest_run
    scope: backend
    url: /api/backtest/run
    window_days: 60
    precompute: true
    required_keys: [summary_metrics, equity_curve, trades]
    test_cases: [TC-BACK-V2-API-001, TC-BACK-V2-API-002]
    title: Backtest v2 run
    user_story: ???????? ????????? Backtest v2 ????? API.
    expectations:
      - ????? ???????? summary_metrics, equity_curve ? trades.

  - id: forward-start
    type: post_json
    scope: backend
    url: /api/forward/start
    payload: {}
    required_keys: [run_id, status, state]
    test_cases: [TC-FWD-API-001]
    title: Forward start
    user_story: Оператор инициализирует forward-run.
    expectations:
      - Ответ содержит run_id и начальное состояние.
  - id: forward-status
    type: http_status
    scope: backend
    url: /api/forward/status
    test_cases: [TC-FWD-API-002, TC-FWD-UI-001]
    title: Forward status
    user_story: Оператор проверяет статус forward-run.
    expectations:
      - Endpoint возвращает 200, когда forward-run активен.
  - id: hpo
    type: post_json
    scope: backend
    url: /api/hpo/run
    payload:
      base:
        test:
          start_date: 2020-01-01
          end_date: 2020-12-31
        universe:
          max_pairs: 1
    required_keys: [status, run_id]
    test_cases: [TC-HPO-UNIT-001]
    title: HPO run
    user_story: Researcher starts an HPO run.
    expectations:
      - Response includes run_id and running status.
  - id: hpo-status
    type: http_status
    scope: backend
    url: /api/hpo/status
    test_cases: [TC-HPO-API-002]
    title: HPO status
    user_story: Operator checks HPO run status.
    expectations:
      - Endpoint returns 200 after a run is started.
  - id: spread-series
    type: spread_series
    scope: backend
    pair_source: top_pairs
    window_days: 60
    required_keys:
      - spread_mid
      - spread_pct
      - entry_flag
      - exit_flag
    test_cases: [TC-SPREAD-API-001, TC-SPREAD-UI-001, TC-SPREAD-UI-002]
    title: График спреда
    user_story: Пользователь видит данные для графика спреда.
  - id: frontend
    type: http_status
    scope: frontend
    url: /
    test_cases: [TC-FE-HTTP-001]
    title: Доступность UI
    user_story: Пользователь может открыть UI.
  - id: frontend-proxy
    type: api_list
    scope: frontend
    url: /api/top-pairs?limit=5
    require_non_empty: false
    test_cases: [TC-FE-PROXY-001]
    title: Прокси API
    user_story: UI получает данные через proxy.
  - id: unified-minute-runtime
    type: api_list
    scope: backend
    url: /api/top-pairs?limit=5
    require_non_empty: false
    required_keys: [stock, future, signal_action, signal_score]
    test_cases: [TC-UNI-API-001, TC-UNI-API-002, TC-PERF-GATE-MAN-001, TC-PERF-ARCH-UNIT-001]
    title: Unified minute-first market runtime
    user_story: Backend market tables are served by unified minute replay runtime with compatibility fields.
    expectations:
      - Endpoints return compatible payloads for top-pairs/signals/backtests and support refresh via unified engine.
