database:
  url: "sqlite:///./data/news_livecheck_ng.db"
  echo: false

news_ingest:
  enabled: true
  rss_urls: []
  max_items_per_run: 20
  gdelt_enabled: true
  gdelt_max_records_per_call: 80
  gdelt_min_request_interval_sec: 2.0
  gdelt_request_timeout_sec: 30
  backfill_chunk_days: 30
  backfill_max_windows_per_commodity: 4
  newsapi:
    enabled: true
    api_key_env: "NEWS_API_KEY"
    timeout_sec: 30
    page_size: 100
    sort_by: "publishedAt"
    retry_attempts: 2
    retry_backoff_sec: 1.0
    live_min_interval_minutes: 90
    backfill_chunk_days: 1
    daily_quota: 100
    realtime_budget: 55
    backfill_budget: 35
    backfill_windows_per_commodity: 3
    emergency_buffer: 10
  causal_profile: "discovery"
  discovery_feed_path: "data/output/news_live/live_news_discovery.csv"
  discovery_feed_min_confidence: 0.55
  discovery_feed_min_fundamental_score: 0.35
  discovery_feed_require_primary_cause: false
  discovery_min_link_score: 0.6
  verified_feed_path: "data/output/news_live/live_news_verified.csv"
  verified_feed_min_confidence: 0.6
  verified_feed_min_fundamental_score: 0.45
  verified_feed_require_primary_cause: true
  verified_feed_require_verified_move: true
  verified_feed_require_verified_both_horizons: true
  verified_min_link_score: 0.7
  qc_min_news_per_ticker: 50
  qc_min_price_points_per_ticker: 500
  commodity_profiles:
    - ticker: "BRN"
      name: "Brent Crude Oil"
      gdelt_query: "(\"brent crude\" OR \"ice brent\" OR opec OR \"strait of hormuz\" OR tanker)"
      newsapi_query: "(\"brent\" OR \"crude oil\" OR opec OR hormuz OR tanker)"
    - ticker: "NG_US"
      name: "US Natural Gas"
      gdelt_query: "(\"natural gas\" OR \"henry hub\" OR \"nymex gas\" OR lng OR \"eia storage\")"
      newsapi_query: "(\"natural gas\" OR \"henry hub\" OR lng OR \"eia storage\")"
    - ticker: "GOLD"
      name: "Gold"
      gdelt_query: "(\"gold futures\" OR bullion OR \"real yields\" OR \"safe haven\")"
      newsapi_query: "(gold OR bullion OR \"safe haven\" OR \"real yields\")"
    - ticker: "SILVER"
      name: "Silver"
      gdelt_query: "(\"silver futures\" OR \"industrial silver\" OR \"solar demand silver\" OR \"silver mine\")"
      newsapi_query: "(silver OR xag OR \"solar demand\" OR \"silver mine\")"
    - ticker: "PLATINUM"
      name: "Platinum"
      gdelt_query: "(\"platinum futures\" OR \"south africa platinum\" OR pgm OR autocatalyst)"
      newsapi_query: "(platinum OR xpt OR pgm OR autocatalyst)"
    - ticker: "PALLADIUM"
      name: "Palladium"
      gdelt_query: "(\"palladium futures\" OR \"russian palladium\" OR pgm OR autocatalyst)"
      newsapi_query: "(palladium OR xpd OR \"russian palladium\" OR autocatalyst)"
    - ticker: "COPPER"
      name: "Copper"
      gdelt_query: "(\"copper futures\" OR codelco OR escondida OR \"mine strike\" OR smelter)"
      newsapi_query: "(copper OR codelco OR escondida OR \"mine strike\" OR smelter)"
    - ticker: "ALUMINUM"
      name: "Aluminum"
      gdelt_query: "(\"aluminum futures\" OR \"aluminium price\" OR bauxite OR alumina OR smelter)"
      newsapi_query: "(aluminum OR aluminium OR bauxite OR alumina OR smelter)"
    - ticker: "NICKEL"
      name: "Nickel"
      gdelt_query: "(\"nickel futures\" OR \"indonesia nickel\" OR \"ore export\" OR \"stainless steel demand\")"
      newsapi_query: "(nickel OR \"indonesia nickel\" OR \"ore export\" OR \"stainless steel\")"
    - ticker: "ZINC"
      name: "Zinc"
      gdelt_query: "(\"zinc futures\" OR \"zinc smelter\" OR \"mine disruption\" OR \"treatment charges\")"
      newsapi_query: "(zinc OR \"zinc smelter\" OR \"mine disruption\" OR \"treatment charges\")"
    - ticker: "WHEAT"
      name: "Wheat"
      gdelt_query: "(\"wheat futures\" OR \"black sea wheat\" OR \"grain corridor\" OR \"wheat drought\")"
      newsapi_query: "(wheat OR \"black sea wheat\" OR \"grain corridor\" OR usda)"
    - ticker: "SUGAR"
      name: "Sugar"
      gdelt_query: "(\"sugar futures\" OR \"raw sugar\" OR \"brazil sugar\" OR \"india sugar export\" OR \"ethanol parity\")"
      newsapi_query: "(sugar OR \"raw sugar\" OR \"brazil sugar\" OR \"ethanol parity\")"
    - ticker: "COFFEE"
      name: "Coffee"
      gdelt_query: "(\"coffee futures\" OR arabica OR robusta OR \"coffee frost\" OR drought)"
      newsapi_query: "(coffee OR arabica OR robusta OR frost OR drought)"
    - ticker: "COCOA"
      name: "Cocoa"
      gdelt_query: "(\"cocoa futures\" OR \"ivory coast cocoa\" OR ghana OR harmattan OR \"crop disease\")"
      newsapi_query: "(cocoa OR \"ivory coast\" OR ghana OR harmattan OR \"crop disease\")"
    - ticker: "ORANGE"
      name: "Orange Juice"
      gdelt_query: "(\"orange juice futures\" OR fcoj OR \"citrus greening\" OR \"orange crop\")"
      newsapi_query: "(\"orange juice\" OR fcoj OR \"citrus greening\" OR \"orange crop\")"

news_models:
  enabled_models: ["finbert", "nli"]
  primary_model: "finbert"
  inference_batch_size: 1
  inference_text_max_chars: 900
  inference_thread_cap: 1
  calibration_mode: "none"
  promotion_min_sample_count: 25
  decision_weight_quality_horizon: "1h"
  decision_weight_quality_max_age_hours: 168

news_llm:
  enabled: false
  full_pass_enabled: false
  model_id: "gpt-5-mini"
  max_items_per_run: 0
  max_input_chars: 1200
  max_output_tokens: 120
  request_timeout_sec: 30
  max_retries: 1
  retry_backoff_sec: 1.0
  temperature: 0.0
  top_impact_priority: true
  min_impact_for_priority: 0.0

ui:
  ff_news_bridge_enabled: true
  ff_news_model_advisory_enabled: true
  ff_news_model_decision_weight_enabled: false
