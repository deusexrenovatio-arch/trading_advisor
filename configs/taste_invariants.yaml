version: 1

python:
  max_lines_default: 800
  allowed_large_files:
    src/moex_carry/ui/app.py: 6000
    src/moex_carry/pipeline.py: 2800
    src/moex_carry/backtest_v2/engine.py: 1800
    src/moex_carry/backtest_v2/minute_portfolio_engine.py: 900
    src/moex_carry/unified_runtime.py: 2000
    src/moex_carry/integrations/telegram_worker.py: 1400
    src/moex_carry/portfolio/rebalance_controller.py: 1000
  forbid_wildcard_imports: true
  module_name_regex: "^[a-z0-9_]+\\.py$"

logging:
  default_format_must_include:
    - "%(asctime)s"
    - "%(levelname)s"
    - "%(name)s"
    - "%(message)s"
