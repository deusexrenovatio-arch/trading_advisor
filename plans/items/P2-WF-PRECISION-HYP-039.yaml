id: P2-WF-PRECISION-HYP-039
title: Integrate precision-filter hypothesis loop with deterministic impact artifacts
  for morning-plan WF
lane: strategy
status: completed
execution_mode: autonomous
owner: product-engineering
acceptance:
- walk-forward runner supports optional precision filter rules without changing default
  baseline behavior
- precision filter supports setup-id dedup and rule-based gating by side/setup kind/stop
  model/decision time/risk and target return
- impact of each integrated hypothesis is written to a versioned artifact under artifacts/research
- docs and operational memory capture accepted/rejected hypotheses to avoid repeated
  loops
- hypothesis verifier supports precompiled signal-tape batch checks with measured
  >=10x speedup and parity against legacy path
- multi-seed causal search loop is executable with early-pruning and proves whether
  filter-space still contains final-go candidates
- execution-only causal tuning path can satisfy hard-go acceptance on seed124 without
  probability gate
