id: P2-NEWS-DISCOVERY-047
title: Split discovery vs verified news feeds, remove legacy prod routes, and wire
  discovery into gate and Telegram
lane: strategy
status: completed
execution_mode: autonomous
owner: product-engineering
acceptance:
- news_root_cycle exports live_news_discovery.csv and live_news_verified.csv
- discovery feed is the default input for `news_live_bridge` and Telegram news alerts
- live storage/feed contracts expose story-first many-to-many commodity attribution
  rows
- Telegram discovery output groups multi-commodity rows by story_id into one message
  without move-verification fields
- legacy operational scripts for `news_ingest` and `shock_label_cycle` are removed
  from production code paths and docs
- new task scheduler wrappers manage only `MoexCarry-NewsRootLive` and `MoexCarry-NewsRootBackfill`
