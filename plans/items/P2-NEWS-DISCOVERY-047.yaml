  tests/test_news_operational_contract.py -q
- powershell -ExecutionPolicy Bypass -File scripts/start_news_root_cycle.ps1 -CheckOnly
- powershell -ExecutionPolicy Bypass -File scripts/manage_news_root_cycle_task.ps1
  -Action Install -DryRun
- python scripts/run_lean_gate.py
- python scripts/validate_quality_scorecards.py
