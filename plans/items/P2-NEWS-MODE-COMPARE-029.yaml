id: P2-NEWS-MODE-COMPARE-029
title: Add deterministic A/B comparator for current and root-event news matching modes
lane: strategy
status: completed
execution_mode: autonomous
owner: product-engineering
acceptance:
- comparator builds side-by-side outputs for current broad-first and proposed root-event
  strict selection
- report includes coverage, timeliness, labeled directional accuracy, and per-symbol
  deltas
- CLI entrypoint exists for reproducible reruns on the same shock-news dataset
- threshold sweep can identify precision-focused profile under minimum coverage constraint
checks:
- python -m pytest tests/test_news_mode_compare.py -q
- python -m ruff check src/moex_carry/news_mode_compare.py scripts/compare_news_modes.py
  tests/test_news_mode_compare.py src/moex_carry/cli.py
- python scripts/compare_news_modes.py --input-csv data/output/news_perf_365d_5m_opt/shock_news_1h_annual_all.csv
  --output-dir data/output/news_mode_compare_365d_5m_opt --run-sweep --sweep-broad-grid
  0.0,0.6,1.0 --sweep-v2-grid 0.0,0.4 --sweep-min-coverage 0.1
- python -m moex_carry.cli news_mode_compare --input-csv data/output/news_perf_365d_5m_opt/shock_news_1h_annual_all.csv
  --output-dir data/output/news_mode_compare_cli_smoke --max-delay-min 60 --broad-min-relevance
  0.6 --v2-min-relevance 0.4
docs:
