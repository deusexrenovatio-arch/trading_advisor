id: P2-NEWS-LIVE-INGEST-035
title: Add live and backfill commodity news ingestion with model scoring and runtime
  news-gate bridge
lane: strategy
status: completed
execution_mode: autonomous
owner: product-engineering
acceptance:
- News ingestion supports GDELT and NewsAPI with separate live/backfill modes and
  daily quota split.
- Live ingestion applies retry/backoff for unstable providers and throttles NewsAPI
  live polling per commodity.
- Runtime scoring supports NLI or FinBERT with automatic GPU device selection and
  keyword fallback.
- Scored news are persisted and exported to a rolling feed CSV for operational visibility.
- Pipeline news gate reads live-scored news items from SQLite instead of hardcoded
  empty list.
- Scheduler scripts install 5-minute live polling and independent backfill task.
checks:
- python -m pytest tests/test_news_live_runtime.py tests/test_news_filter.py -q
- python -m ruff check src/moex_carry/news_live_runtime.py src/moex_carry/news_live_clients.py
  src/moex_carry/news_live_scoring.py src/moex_carry/news_live_bridge.py scripts/run_news_ingest_cycle.py
  src/moex_carry/cli.py src/moex_carry/pipeline.py tests/test_news_live_runtime.py
