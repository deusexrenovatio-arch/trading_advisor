name: Docs Gardening

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  docs-gardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run lean governance gate
        run: python scripts/run_lean_gate.py --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Build docs gardening report
        run: |
          python scripts/doc_gardening_report.py \
            --output docs-gardening-report.md \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Build autonomy KPI report
        run: |
          python scripts/autonomy_kpi_report.py \
            --output autonomy-kpi-report.md \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload docs gardening artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-gardening-report
          path: |
            docs-gardening-report.md
            autonomy-kpi-report.md
