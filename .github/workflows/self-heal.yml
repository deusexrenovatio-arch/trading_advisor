name: Self Heal

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  self-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run deterministic self-heal
        run: |
          python scripts/self_heal.py \
            --report self-heal-report.json \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Detect self-heal drift files
        id: detect-drift
        shell: bash
        run: |
          if git diff --quiet -- docs/architecture/architecture-map-data.js plans/PLANS.yaml; then
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload self-heal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-report
          path: self-heal-report.json
      - name: Escalate failed self-heal to issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "governance: self-heal failed and requires manual judgment";
            const body = [
              "Self-heal workflow failed after deterministic remediation attempts.",
              "",
              "Runbook:",
              "- docs/runbooks/self-heal-escalation.md",
              "",
              "Artifact:",
              "- self-heal-report.json",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["governance", "incident", "self-heal"]
            });
      - name: Create self-heal PR (if changes)
        id: create-self-heal-pr
        if: always() && steps.detect-drift.outputs.has_drift == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/self-heal-drift
          commit-message: "chore(governance): automated self-heal drift fix"
          title: "chore(governance): automated self-heal drift fix"
          body: |
            Automated self-heal workflow detected and remediated deterministic drift.

            - Report: `self-heal-report.json`
            - Source workflow: `self-heal`
          labels: |
            automation
            governance
          add-paths: |
            docs/architecture/architecture-map-data.js
            plans/PLANS.yaml
