name: Self Heal

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  self-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run deterministic self-heal
        run: |
          python scripts/self_heal.py \
            --report self-heal-report.json \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload self-heal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-report
          path: self-heal-report.json
      - name: Create self-heal PR (if changes)
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/self-heal-drift
          commit-message: "chore(governance): automated self-heal drift fix"
          title: "chore(governance): automated self-heal drift fix"
          body: |
            Automated self-heal workflow detected and remediated deterministic drift.

            - Report: `self-heal-report.json`
            - Source workflow: `self-heal`
          labels: |
            automation
            governance
