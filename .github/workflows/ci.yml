name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic agent review
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/agent_review.py \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}" \
              --output agent-review-findings.md \
              --summary-file "$GITHUB_STEP_SUMMARY"
          else
            python scripts/agent_review.py \
              --base-sha "${{ github.event.before }}" \
              --head-sha "${{ github.sha }}" \
              --output agent-review-findings.md \
              --summary-file "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload agent-review findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-review-findings
          path: agent-review-findings.md

  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run lean governance gate + publish metrics
        run: python scripts/run_lean_gate.py --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Data integrity parity gate
        run: |
          if ls data/output/intraday_minute_series/intraday_minute_series_*.csv >/dev/null 2>&1; then
            python scripts/check_data_integrity.py --data-dir data --max-day-gap 2
          else
            echo "Skip data integrity parity gate: no minute source files in checkout."
          fi
      - name: Validate dependency ADR contract with diff refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/validate_dependency_decisions.py \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}"
          else
            python scripts/validate_dependency_decisions.py \
              --base-sha "${{ github.event.before }}" \
              --head-sha "${{ github.sha }}"
          fi

  quality-scorecards:
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Evaluate quality scorecards
        run: |
          python scripts/validate_quality_scorecards.py \
            --report quality-scorecard.md \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload quality scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-scorecard
          path: quality-scorecard.md

  governance-dashboard:
    needs:
      - governance
      - quality-scorecards
      - agent-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build combined governance dashboard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/build_governance_dashboard.py \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}" \
              --output governance-dashboard.md \
              --artifacts-dir .runlogs/governance-dashboard \
              --summary-file "$GITHUB_STEP_SUMMARY"
          else
            python scripts/build_governance_dashboard.py \
              --base-sha "${{ github.event.before }}" \
              --head-sha "${{ github.sha }}" \
              --output governance-dashboard.md \
              --artifacts-dir .runlogs/governance-dashboard \
              --summary-file "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload governance dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-dashboard
          path: |
            governance-dashboard.md
            .runlogs/governance-dashboard

  backend:
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pytest
        run: pytest

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-web/package-lock.json
      - name: Python dependency health
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Frontend dependency health
        working-directory: ui-web
        run: |
          npm ci
          npm audit --omit=dev || true

  perf-minute-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run minute runtime perf gate
        run: pytest tests/perf -q

  nfr-journeys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run startup and API journey budgets
        run: pytest tests/perf/test_app_startup_runtime.py tests/perf/test_api_journey_runtime.py -q

  frontend:
    needs: governance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run build (typecheck)
        run: npm run build

  frontend-e2e:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            ui-web/playwright-report
            ui-web/test-results

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install commitlint dependencies
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint commit messages
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --config commitlint.config.cjs

  release-notes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure release note fragment
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files=$(git diff --name-only "$base_sha" "$head_sha")
          if ! echo "$changed_files" | grep -E '^docs/releases\.d/[^/]+\.md$' -q; then
            echo "ERROR: Missing release note fragment in docs/releases.d/."
            echo "Add a file like docs/releases.d/YYYY-MM-DD-short-title.md"
            exit 1
          fi
