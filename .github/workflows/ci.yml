name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-scope:
    runs-on: ubuntu-latest
    outputs:
      surfaces: ${{ steps.scope.outputs.surfaces }}
      backend_required: ${{ steps.scope.outputs.backend_required }}
      ui_required: ${{ steps.scope.outputs.ui_required }}
      governance_only: ${{ steps.scope.outputs.governance_only }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detect-scope dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML
      - id: scope
        name: Compute change surface
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          python scripts/compute_change_surface.py \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --output .runlogs/change-surface.json \
            --format json

          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path(".runlogs/change-surface.json").read_text(encoding="utf-8"))
          surfaces = set(payload.get("surfaces", []))
          backend_surface = {"core", "contracts", "news", "deps", "observability", "perf", "mixed"}
          ui_surface = {"ui", "contracts", "mixed"}
          governance_surface = {"governance", "docs-only"}
          backend_required = bool(surfaces & backend_surface)
          ui_required = bool(surfaces & ui_surface)
          governance_only = bool(surfaces) and surfaces.issubset(governance_surface)
          docs_only = bool(payload.get("docs_only"))
          lines = [
              f"surfaces={','.join(sorted(surfaces))}",
              f"backend_required={str(backend_required).lower()}",
              f"ui_required={str(ui_required).lower()}",
              f"governance_only={str(governance_only).lower()}",
              f"docs_only={str(docs_only).lower()}",
          ]
          with Path(".scope-output.txt").open("w", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

          cat .scope-output.txt >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "## detect-scope"
            echo ""
            cat .scope-output.txt
            echo ""
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  governance-core:
    needs: detect-scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run scoped loop gate
        run: |
          python scripts/run_loop_gate.py \
            --base-ref "${{ needs.detect-scope.outputs.base_sha }}" \
            --head-ref "${{ needs.detect-scope.outputs.head_sha }}" \
            --skip-session-check \
            --summary-file "$GITHUB_STEP_SUMMARY"

  backend-suite:
    needs: detect-scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run backend suite
        if: needs.detect-scope.outputs.backend_required == 'true'
        run: pytest
      - name: Backend deterministic no-op
        if: needs.detect-scope.outputs.backend_required != 'true'
        run: 'echo "backend-suite: no-op (surface does not require backend tests)"'

  ui-suite:
    needs: detect-scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-web/package-lock.json
      - name: Install dependencies
        if: needs.detect-scope.outputs.ui_required == 'true'
        run: npm --prefix ui-web ci
      - name: Run UI lint/build
        if: needs.detect-scope.outputs.ui_required == 'true'
        run: |
          npm --prefix ui-web run lint
          npm --prefix ui-web run build
      - name: UI deterministic no-op
        if: needs.detect-scope.outputs.ui_required != 'true'
        run: 'echo "ui-suite: no-op (surface does not require UI checks)"'

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install commitlint dependencies
        if: github.event_name == 'pull_request'
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --config commitlint.config.cjs
      - name: Commitlint deterministic no-op
        if: github.event_name != 'pull_request'
        run: 'echo "commitlint: no-op (push event)"'
