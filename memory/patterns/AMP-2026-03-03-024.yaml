title: Automate silver expansion with split directional and causal packs
pattern: Build two packs from one curated dataset each day, where directional tasks
  use `v2_clean` and causal-only tasks use `broad/none`, then track results through
  one manifest.
when_to_use: Any annotation cycle where direction labels need high precision but causal
  coverage must scale quickly without manual triage.
