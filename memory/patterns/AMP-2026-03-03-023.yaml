id: AMP-2026-03-03-023
date: 2026-03-03
title: Split shock workflow into detector and direction quality lanes
pattern: Keep high-recall detector broad enough for root shock capture, but compute
  direction quality only on stricter source (`v2_clean`) and gate it by labeled accuracy
  and coverage.
when_to_use: Shock-driven news systems where broad matching improves recall but harms
  directional precision.
