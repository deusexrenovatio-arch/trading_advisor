id: ADM-2026-03-05-078
date: 2026-03-05
title: Reach final-go hypothesis on H24 via iterative root-level search and record
  stability gap
context: Slot/side precision sweeps were insufficient to hit `final_go`; user requested
  continued testing/iteration until goal thresholds were reached.
decision: Performed focused iterative auto-search across constrained artifacts with
  root-level hill-climb and verified best candidate using deterministic verifier;
  accepted passing hypothesis on `h24` (`ORB_BREAKOUT`, clusters `energy+other`, slots
  `12:00/14:15`, 17-root whitelist), then ran cross-artifact check with identical
  filter.
impact: Goal thresholds are now reached on `h24` (`win_rate_net=0.7523`, `trades_per_week=2.0790`,
  positive net, low concentration), but portability remains limited because the same
  filter fails neighboring artifacts and multi-report same-config sweep yields `max_passes=0`;
  next loop must validate causal rerun and OOS stability before promoting as strategy
  baseline.
