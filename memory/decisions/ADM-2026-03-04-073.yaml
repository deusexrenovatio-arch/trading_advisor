id: ADM-2026-03-04-073
date: 2026-03-04
title: Promote task request quality to a hard governance gate
context: External agent-practice review showed that weak operator prompts still caused
  avoidable ambiguity despite strong code-quality gates.
decision: Add `validate_task_request_contract.py`, require explicit task contract
  and first-time-right report sections in session handoff, and run this validator
  inside `run_lean_gate.py`.
impact: Ambiguous or contradictory requests are now blocked early with deterministic
  remediation instead of leaking into implementation and review loops.
links:
