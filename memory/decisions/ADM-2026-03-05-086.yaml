id: ADM-2026-03-05-086
date: 2026-03-05
title: Move WF hypothesis verification to signal-tape engine and validate 44x throughput
  uplift
context: Strategy loops required thousands of deterministic hypothesis checks on `planned_signals`,
  and legacy verifier rescanned raw rows for each candidate, creating a bottleneck
  for iterative causal validation.
decision: Added signal-tape/bitset path to `verify_wf_hypothesis.py` with engine switch
  (`tape|legacy`), lite-summary and rejection-count pruning knobs, plus dedicated
  batch evaluator and benchmark scripts; validated parity against legacy path and
  measured throughput on 8,192 candidates.
impact: Hypothesis verification loop is no longer a blocking runtime stage; benchmark
  shows `44.14x` speedup (`19.99s -> 0.45s`) with `0` parity mismatches, enabling
  much denser candidate sweeps before expensive causal reruns.
links:
