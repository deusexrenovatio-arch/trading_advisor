id: ADM-2026-03-05-076
date: 2026-03-05
title: Optimize futures signal-validation walk-forward runtime via indexed minute
  windows and context-scoped probability cache
context: Futures signal-check runs in `run_morning_plan_walk_forward.py` remained
  slow due to repeated full `m5` scans per setup and repeated probability forecast
  passes over growing history.
decision: Refactor hot path to use `bisect`-based minute-bar slicing in `_simulate_setup`,
  keep cached `m5` timestamps in `WindowEvalCache`, index history by probability context
  inside `_evaluate_window`, and reuse forecast result for allow-path planned signals
  instead of recomputing; align default `--retune-every-folds` with baseline (`3`).
impact: Setup simulation avoids full-list scans, probability gate avoids global-history
  scans and duplicate forecasts, and default fold retuning cadence now follows the
  baseline speed profile without changing signal semantics.
