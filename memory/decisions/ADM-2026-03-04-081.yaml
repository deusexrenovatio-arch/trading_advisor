id: ADM-2026-03-04-081
date: 2026-03-04
title: Expand morning-plan recall families and enforce hard-goal acceptance, then
  map feasible frontier
context: Precision-only loops were unable to satisfy the joint target (`winrate>=0.75`
  and `~2 trades/week`), while baseline acceptance remained optimistic without explicit
  hard constraints and concentration accounting.
decision: Added hard-goal scoring/acceptance controls, introduced new setup families
  (`ORB_BREAKOUT`, `EMA_PULLBACK_LIMIT`), added per-setup `time_stop_minutes`, and
  ran constrained WF iterations H18-H23 with deterministic artifacts.
impact: Pipeline now supports structural recall experiments and hard KPI gating; empirical
  frontier is documented (`win~0.58-0.62` at `tpw~1-4`) and confirms current geometry
  is insufficient for `75%` target without a new two-stage policy; added VWAP family
  currently shows zero effective coverage in isolated probes.
