id: ADM-2026-03-06-091
date: 2026-03-06
title: Complete O1-relative execution ladder and keep O1 as baseline
context: User requested the full `H0`-`H5` execution research program to be run end-to-end
  against frozen `O1`, with conclusions fixed in repo memory before the next optimization
  cycle.
decision: Added a deterministic runner for the O1-relative ladder, completed `H0`-`H5`
  on the frozen front-nearest window, and kept `O1` as baseline because no tested
  candidate improved net revenue while also satisfying the same hard concentration
  constraint. `H1` and `H2` were noisy/inert, `H3` stop widening and `H4` RR-cap removal
  improved revenue but worsened concentration, `H4` absolute caps repaired concentration
  but destroyed too much net, and `H5` remained sensitivity-only/disallowed.
impact: 'Execution research is now narrowed to one unresolved problem: concentration-aware
  control of the revenue levers exposed by `sl_rr` and `max_profit_rr`. Future loops
  should not reopen fill-quality, break-even, trailing, or same-bar assumptions as
  primary axes on this frozen window.'
