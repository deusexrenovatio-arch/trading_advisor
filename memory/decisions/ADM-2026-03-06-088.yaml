id: ADM-2026-03-06-088
date: 2026-03-06
title: Split live signals by strategy stream end-to-end for API actionability and
  Telegram delivery
context: User asked to separate arbitrage and commodity-futures signals in the existing
  live paper-forward contour while preserving current Telegram format and ACK flow.
decision: Added normalized strategy metadata propagation (`strategy_id`, `strategy_type`,
  `strategy_stream`) from runtime adapter into API actionability payloads, strategy-aware
  signal fingerprinting, and Telegram worker stream-aware cooldown/daily keys plus
  strategy label in messages.
impact: Live contour can now filter and track signals per strategy stream without
  cross-stream dedupe collisions; operator can query actionability by stream and receive
  Telegram messages tagged by strategy.
