id: ADM-2026-03-09-098
date: 2026-03-09
title: H4A remains an execution-only winner after money-based risk sizing, and its
  uplift comes entirely from post-fill exits
context: User asked to recheck the stronger old execution profile (`H4A_CAP_OFF`)
  without changing its logic, but now on the corrected money-sizing path, and to compare
  it directly with the current `baseline risk`.
decision: Added `scripts/run_h4a_vs_baseline_risk.py` and reran both `baseline risk`
  and `H4A risk` on the same frozen `O1` reference with `target_risk_pct` sizing.
  The only execution delta was `max_profit_rr` changing from `0.3` to `0.0`. Results
  improved from `12.97%` to `20.55%` ROE and from `5.08%` to `8.66%` ROE outside top-3
  months, while fill count (`222`), fill rate (`0.8571`), gate mix, and quantity distribution
  stayed unchanged.
impact: Future comparisons should treat `H4A` as the stronger execution reference
  than `baseline risk` unless concentration controls or stricter stress assumptions
  reverse the result. The uplift should be interpreted as an exit-path effect after
  fill, not as a fill-quality or position-sizing effect.
