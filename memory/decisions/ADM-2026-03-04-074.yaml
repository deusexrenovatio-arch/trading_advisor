id: ADM-2026-03-04-074
date: 2026-03-04
title: Enforce repeated-issue self-learning with mandatory behavior-change fields
  and loop-breaker policy
context: Existing repeated-issue workflow emphasized deep analysis but did not strictly
  require future behavior change evidence or explicit stop/reset/new-search controls.
decision: Extend incident policy and memory validator with required learning fields
  for new incidents; extend task-contract validator with mandatory repetition control;
  update repeated-issue-review skill output requirements.
impact: Repeated failures now require explicit prevention artifacts and capped same-path
  attempts; context reset and new search-space probing are enforced before continued
  patching.
links:
- configs/agent_incident_policy.yaml
- scripts/validate_agent_memory.py
- scripts/validate_task_request_contract.py
- docs/checklists/task-request-contract.md
- .cursor/skills/repeated-issue-review/SKILL.md
- docs/DEV_WORKFLOW.md
- AGENTS.md
