id: ADM-2026-03-06-090
date: 2026-03-06
title: Restrict execution optimization to O1-relative economic levers and sequential
  family tests
context: User clarified that the goal of execution research is larger net revenue
  versus baseline, and requested that conclusions about useful versus misleading levers
  be fixed in durable project memory before the next hypothesis loop.
decision: Treat `O1` as the only comparison anchor, optimize first on fill-quality
  and trade-management levers, delay bracket-clipping levers until later, and forbid
  cost multipliers or same-bar policy from being used as primary optimization axes;
  run hypotheses one family at a time and record a verdict for each family before
  moving on.
impact: 'Future execution research now has a deterministic ladder: economically credible
  levers first, simulator-assumption levers only as sensitivity checks, and every
  claimed improvement must explain how it beats O1.'
