id: ADM-2026-03-04-070
date: 2026-03-04
title: Make NewsAPI backfill windowed with deterministic cursor progression
context: A single wide backfill request per commodity returned only the latest top-100
  items, leaving recent historical days underfilled and breaking shock-to-news matching
  quality.
decision: Add per-commodity NewsAPI backfill windows per run (`newsapi_backfill_windows_per_commodity`)
  with independent day chunking (`newsapi_backfill_chunk_days`) and move runtime state/budget
  helpers into `news_runtime_state.py`.
impact: Backfill now advances history predictably and fills recent windows needed
  for live shock linking; runtime governance line-budget blocker on `news_live_runtime.py`
  was also removed.
links:
- src/moex_carry/news_live_runtime.py
- src/moex_carry/news_runtime_state.py
- tests/test_news_live_runtime.py
- configs/news-livecheck-ng.yaml
