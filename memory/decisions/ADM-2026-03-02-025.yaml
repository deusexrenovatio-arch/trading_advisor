id: ADM-2026-03-02-025
date: 2026-03-02
title: Reframe staged protocol as true sequential two-leg execution with explicit
  fallback actions
context: Prior staged implementation widened tolerance windows but still executed
  pair legs atomically, which mismatched manual Telegram workflow assumptions.
decision: Add sequential entry/exit protocol controls, execute legs in configured
  order, unwind or force-close second leg on timeout, and expose protocol details
  in signal metrics and Telegram messages.
impact: Replay/backtest behavior now matches manual staged execution expectations
  and comparison runs can measure execution-quality deltas for real two-leg handling.
