  - id: ADM-2026-03-04-072
    date: 2026-03-04
    title: Add precision-filter gate to walk-forward runner and lock first hypothesis artifact
    context: Baseline analysis showed duplicate setup_id rows across decision slots and unstable winrate concentration, while requested target is precision-first improvement with explicit impact tracking.
    decision: Extend `run_morning_plan_walk_forward.py` with optional precision filter controls (`--enable-precision-filter`, side/setup/stop/time allowlists, `min_risk_ticks`, `min_target_return_pct`, and `--precision-dedup-setup-ids`) and serialize filter config in `tuning_points`; evaluate Hypothesis #1 (`min_risk_ticks>=114 + dedup`) on baseline planned signals and persist results artifact.
    impact: Team can run controlled precision experiments without changing default baseline path, and each hypothesis now has deterministic metrics artifact to prevent repeated analysis loops.
