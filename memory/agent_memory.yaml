decisions:
  - id: ADM-2026-03-09-095
    date: 2026-03-09
    title: Stage post-burn-in process regression gating around acknowledged baseline debt
    context: Process telemetry burn-in completed, and the repository started hard-blocking every new task on historical decision-quality and context-efficiency debt even when no fresh regression had been introduced by the current diff.
    decision: Keep rolling metrics and thresholds intact, but distinguish acknowledged baseline debt from fresh or worsening regressions; allow only explicitly tracked decision-quality and context-efficiency debt to remain non-blocking under an active remediation plan, and return to hard blocking as soon as a new dimension fails or the acknowledged debt worsens by at least one task-equivalent step.
    impact: Ordinary development can continue without admin bypass while the baseline process debt is being remediated, and governance reports, API payloads, and validator behavior all share one staged policy instead of drifting independently.
    links:
      - src/moex_carry/governance/process_reports.py
      - src/moex_carry/governance/process_report_text.py
      - scripts/validate_process_regressions.py
      - plans/PLANS.yaml
      - docs/runbooks/governance-remediation.md
  - id: ADM-2026-03-09-094
    date: 2026-03-09
    title: Use Telegram follow-up confirmations as the H4A baseline guard instead of implicit ACK semantics
    context: H4A execution had already moved to explicit fill-driven lifecycle states, but documentation and operator-loop coverage still left a gap between post-fill recalculation, Telegram prompts, and auditable confirmation of each required manual step.
    decision: Treat `mark_viewed` as the canonical Telegram review action, add explicit `confirm_followup` and `manual_override` stage actions for H4A fallback or post-fill monitoring, and isolate operator-event projection logic in a dedicated UI helper so lifecycle reconstruction stays deterministic without keeping more H4A state machinery inside `ui/app.py`.
    impact: Telegram now covers fallback timeout, recalculated post-fill packet, break-even or trailing triggers, and time-stop monitoring with auditable stage confirmations, while governance artifacts and acceptance catalogs describe the same lifecycle and `ui/app.py` is back under the blocking size limit.
    links:
      - src/moex_carry/ui/operator_execution_projection.py
      - src/moex_carry/integrations/telegram_h4a_followup.py
      - docs/signals-business-process.md
      - docs/test-cases.md
      - configs/acceptance_scenarios.yaml
      - configs/user_needs_catalog.yaml
  - id: ADM-2026-03-09-093
    date: 2026-03-09
    title: Treat H4A runbook as the normative live execution contract and move operator lifecycle to execution-fact states
    context: Research and runbook work already promoted `H4A_CAP_OFF` as the preferred execution profile, but runtime signal delivery and UI/API lifecycle still behaved like a coarse `ack`-driven intent model with callback-TTL expiry and no fill-driven recalculation contract.
    decision: Promote `H4A_CAP_OFF` as the only active baseline in runtime-facing metadata, use `docs/runbooks/h4a-manual-execution-baseline.md` as the execution source of truth, keep `O1` only as a regression reference, replace `ack` semantics with explicit viewed/submitted/filled/cancelled/manual-override states, and treat concentration control as a separate live-routing layer rather than a reason to reintroduce winner caps into the baseline.
    impact: Manual execution, runtime actionability, and audit trails can now converge on one H4A contract, while legacy `ack` remains only as a compatibility alias and concentration remains controlled by routing/exposure logic instead of baseline distortion.
    links:
      - docs/runbooks/h4a-manual-execution-baseline.md
      - docs/signals-business-process.md
      - docs/research/execution-profiles-historical-review-no-minis-2026-03-06.md
