    context: Precision-only loops were unable to satisfy the joint target (`winrate>=0.75` and `~2 trades/week`), while baseline acceptance remained optimistic without explicit hard constraints and concentration accounting.
    decision: Added hard-goal scoring/acceptance controls, introduced new setup families (`ORB_BREAKOUT`, `EMA_PULLBACK_LIMIT`), added per-setup `time_stop_minutes`, and ran constrained WF iterations H18-H23 with deterministic artifacts.
