incidents:
  - id: AMI-2026-02-20-001
    date: 2026-02-20
    title: Worktree drift during edits
    symptom: Early edits were applied to a different checkout path and had to be re-synced.
    root_cause: Missing immediate cwd verification before patch phase.
    remediation: Enforce worktree_guard check at task start and before major edit batches.
    remediation_type: guardrail
    links:
      - scripts/worktree_guard.ps1
  - id: AMI-2026-02-20-002
    date: 2026-02-20
    title: EPERM lock on esbuild/rollup binaries during npm ci
    symptom: npm cleanup failed to unlink binary files under ui-web/node_modules on Windows.
    root_cause: Background vite/esbuild processes held file handles during reinstall.
    remediation: Stop vite/esbuild processes before reinstall and continue with npm install when ci unlink fails.
    remediation_type: workflow
    links:
      - docs/DEV_WORKFLOW.md
      - ui-web/package-lock.json
  - id: AMI-2026-02-20-003
    date: 2026-02-20
    title: Hard reboot under high multi-agent memory commit pressure
    symptom: Unexpected reboot and hangs with mixed BSOD and live-kernel events during parallel agent workloads.
    root_cause: Near-limit commit pressure amplified by concurrent heavy agents plus unstable low-level utility and driver interactions.
    remediation: Standardize launch gates, concurrency limits, and stop/replan thresholds in a dedicated runbook.
    remediation_type: guardrail
    links:
      - agent-runbook.md
      - memory/agent_memory.yaml
  - id: AMI-2026-02-20-004
    date: 2026-02-20
    title: Cursor indexing storm during parallel agent execution
    symptom: Spikes of pending documents, forced index resets, and repeated sync cycles during heavy sessions.
    root_cause: Background indexing scope included high-churn generated paths while compute agents were active.
    remediation: Exclude generated paths with .cursorignore and avoid concurrent heavy indexing with three heavy agents.
    remediation_type: guardrail
    links:
      - .cursorignore
      - agent-runbook.md
  - id: AMI-2026-02-22-005
    date: 2026-02-22
    title: Repeated signal verification loops due to projection/file/source mismatch
    symptom: Same signal questions re-opened because outputs differed between branches, runtime processes, and file paths.
    root_cause: Checks mixed `data/output/*`, `data/output/unified/*`, and live API state without explicit source contract.
    remediation: Document and enforce canonical source order and verification checklist in a dedicated signal continuity runbook.
    remediation_type: docs
    links:
      - docs/runbooks/signal-agent-continuity.md
      - docs/session_handoff.md
  - id: AMI-2026-02-23-006
    date: 2026-02-23
    title: Telegram worker cycle spammed errors on transient long-poll disconnects
    symptom: "Worker logged Telegram worker cycle failed stack traces when Telegram closed getUpdates connections without response."
    root_cause: "_fetch_updates treated transient transport and retryable HTTP failures as fatal instead of bounded-retry/no-op cycles."
    remediation: "Add one bounded retry for getUpdates, degrade to empty update batch on repeated transient failure, and lock behavior with tests."
    remediation_type: capability
    links:
      - src/moex_carry/integrations/telegram_worker.py
      - tests/test_telegram_worker.py
  - id: AMI-2026-02-23-007
    date: 2026-02-23
    title: Editable package path drifted to another worktree during architecture patch validation
    symptom: Pytest in a new worktree imported moex_carry from a different checkout path and missed new repository symbols.
    root_cause: Local editable install still pointed to previous worktree after branch/worktree switch.
    remediation: Reinstall editable package from active worktree before running tests.
    remediation_type: workflow
    links:
      - pyproject.toml
      - docs/DEV_WORKFLOW.md
  - id: AMI-2026-03-03-008
    date: 2026-03-03
    title: Self-heal workflow failed daily on PR-creation policy mismatch
    symptom: Scheduled self-heal runs on main were marked failed even when deterministic self-heal and lean gate passed.
    root_cause: create-pull-request attempted to commit untracked self-heal-report.json and then failed because repository settings disallow Actions-created PRs.
    remediation: Gate PR step by actual drift files and constrain PR paths to governance-managed targets only.
    remediation_type: workflow
    links:
      - .github/workflows/self-heal.yml
      - scripts/self_heal.py
      - docs/runbooks/self-heal-escalation.md

patterns:
  - id: AMP-2026-03-06-015
    date: 2026-03-06
    title: Human-facing root references use ticker plus underlying name
    pattern: In strategy research, diagnostics, and user-facing summaries, write roots as `TICKER (Name)` and exclude mini contracts when a full contract for the same underlying is already present.
    when_to_use: Any whole-universe strategy report, per-root analysis, negative-month decomposition, or baseline decision memo.
    links:
      - docs/research/evaluation-policy.md
      - docs/research/execution-profiles-historical-review-no-minis-2026-03-06.md
      - memory/agent_memory.yaml
  - id: AMP-2026-03-06-014
    date: 2026-03-06
    title: Separate revenue levers from promotion-safe levers
    pattern: If an execution lever raises `net_ticks_sum` but still worsens concentration or fails the same hard-go constraints, record it as mechanism evidence and carry it forward only into a concentration-aware next search space; do not promote it as the new baseline.
    when_to_use: Any O1-relative execution comparison where revenue and hard-go constraints move in opposite directions.
    links:
      - docs/research/o1-execution-hypothesis-results-2026-03-06.md
      - artifacts/research/wf_goal_v6_h24_o1_execution_hypothesis_ladder_20260306.json
      - memory/agent_memory.yaml
  - id: AMP-2026-03-06-013
    date: 2026-03-06
    title: One execution family at a time against O1
    pattern: Keep O1 frozen, test one execution family at a time, and write a verdict before mixing families. Start with fill-quality levers, then trade management, then bracket geometry, and treat simulator-assumption levers only as sensitivity checks.
    when_to_use: Any walk-forward or paper-forward execution research that claims uplift versus O1.
    links:
      - docs/research/o1-execution-hypothesis-program-2026-03-06.md
      - memory/agent_memory.yaml
      - plans/PLANS.yaml
  - id: AMP-2026-03-06-012
    date: 2026-03-06
    title: Rebase drift needs explicit baseline sign-off
    pattern: If a rebase changes runtime, research, or execution baseline behavior, write the drift down immediately, compare it against O1, and choose accept/revert based on the active branch goal instead of silently inheriting merged defaults.
    when_to_use: Any rebase, merge, or cherry-pick that changes signal selection, execution semantics, artifact metrics, or operator-visible behavior.
    links:
      - docs/session_handoff.md
      - memory/agent_memory.yaml
      - plans/PLANS.yaml
  - id: AMP-2026-02-20-001
    date: 2026-02-20
    title: Progressive disclosure first
    pattern: Read only the smallest set of files needed for the active step, then gate quickly.
    when_to_use: Any coding task with multi-doc instructions and potential context bloat.
    links:
      - AGENTS.md
      - docs/DEV_WORKFLOW.md
  - id: AMP-2026-02-20-002
    date: 2026-02-20
    title: No prompt-only remediation
    pattern: Any repeated failure is resolved by capability, guardrail, docs, test, or workflow updates tracked in-repo.
    when_to_use: Repeated incidents, flaky regressions, or governance drift.
    links:
