  - id: ADM-2026-03-04-068
    date: 2026-03-04
    title: Consolidate news runtime storage semantics into shared helper with atomic feed export
    context: Live news runtime, bridge reads, and shock input builder duplicated sqlite URL/path parsing and could produce partial feed CSV snapshots under concurrent reads.
    decision: Add `news_storage.py` as a single storage utility for sqlite path resolution and connection settings; switch runtime/bridge/shock input to shared helper; export live feed via atomic temp-file replace; add indexes for bridge query patterns and warning logs on sqlite read errors.
    impact: Reduced storage divergence and race windows across ingest, bridge, and shock pipelines; improved operational diagnosability without silent data drops.
