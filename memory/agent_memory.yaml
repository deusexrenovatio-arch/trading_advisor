    decision: Extended `run_morning_plan_walk_forward.py` with JSON-driven `ExpertGateConfig` (rule matching by setup/side/slot/root/cluster/instrument plus risk/target thresholds), added `intraday_goal_regime_experts_v1` cluster-specific HPO profile, and executed new causal reruns on seed124 (expert-gate run and regime-expert runs with/without probability gate).
    impact: Structural routing is now integrated in the causal runner and reproducible, but current strategy still fails `hard_min_win_rate_net` (best structural run around `0.524` winrate), and even fast post-run filter search on the new artifact found `0` `final_go` candidates; next search space must shift to execution-model changes (TP/SL/exit semantics), not more filter/routing tuning.
