    context: Research-mode routing still depended on legacy `v2_clean/broad` branches and had no single production cycle that continuously linked root causes to aftershocks in storage.
    decision: Add root-first candidate selection in live shock input, candidate-window NewsAPI enrichment with DB persistence/scoring, persist root/aftershock fields in `news_shock_rows`, auto-build root maintenance tables (`news_root_links`, `news_root_registry`, `news_root_route_edges`), and expose unified `news_root_cycle` CLI command for ingest->shock->root maintenance.
    impact: Runtime now has one operational flow from ingest to root/aftershock linkage with persistent graph context, while preserving fallback candidate modes for coverage and backward compatibility.
