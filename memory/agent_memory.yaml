  - id: ADM-2026-03-04-069
    date: 2026-03-04
    title: Make news-gate timing explicit via as-of timestamp to preserve causal replay semantics
    context: News gate and bridge lookback logic were tied to wall-clock `datetime.now()`, which can break walk-forward/replay behavior and hide news effects when evaluating historical timestamps.
    decision: Add optional `as_of_utc` to `load_news_gate_items` and `apply_news_filter`, and pass one shared timestamp from pipeline decision flow to both components.
    impact: News gating behavior is deterministic for a fixed decision timestamp and now supports causal replay/walk-forward without implicit time drift.
    links:
      - src/moex_carry/strategy/news_filter.py
      - src/moex_carry/news_live_bridge.py
      - src/moex_carry/pipeline.py
      - tests/test_news_filter.py
