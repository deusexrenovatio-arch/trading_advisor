    context: Prior staged implementation widened tolerance windows but still executed pair legs atomically, which mismatched manual Telegram workflow assumptions.
    decision: Add sequential entry/exit protocol controls, execute legs in configured order, unwind or force-close second leg on timeout, and expose protocol details in signal metrics and Telegram messages.
    impact: Replay/backtest behavior now matches manual staged execution expectations and comparison runs can measure execution-quality deltas for real two-leg handling.
    links:
      - src/moex_carry/pipeline.py
      - src/moex_carry/signal_replay/minute_replay.py
      - src/moex_carry/integrations/telegram_worker.py
      - src/moex_carry/contracts/strategy_test.py
      - data/reports/sequential_compare_base_vs_staged_summary_20260302.csv
      - data/reports/sequential_protocol_settings_20260302.json
  - id: ADM-2026-03-03-026
    date: 2026-03-03
    title: Compare news matching modes by precision-coverage tradeoff instead of raw hit-count only
    context: Broad-first shock-to-news linkage produced higher candidate coverage but frequently selected off-topic headlines, masking the quality gain of stricter root-event linking.
    decision: Add deterministic comparator that runs current broad-first and proposed root-event strict selection side-by-side on the same shock dataset, reports per-symbol deltas, and supports threshold sweep with minimum-coverage constraint.
    impact: Team can now make promotion decisions on measurable tradeoffs (coverage, labeled directional accuracy, relevance quality) rather than anecdotal examples.
    links:
      - src/moex_carry/news_mode_compare.py
      - scripts/compare_news_modes.py
      - src/moex_carry/cli.py
      - data/output/news_mode_compare_365d_5m_opt/news_mode_compare_report.txt
  - id: ADM-2026-03-03-027
    date: 2026-03-03
    title: Split shock workflow into primary and aftershock capture metrics
    context: Single shock recall metric mixed initial impulse and continuation bursts, making optimization ambiguous for alerting logic.
    decision: Add deterministic episode segmentation (`primary` + `aftershock`) and report mode capture recall for both roles separately.
    impact: "Tuning now targets the stated objective directly: catch initial market shock while measuring continuation coverage independently."
    links:
      - src/moex_carry/shock_episodes.py
      - scripts/analyze_shock_episodes.py
      - data/output/shock_episode_analysis_2026_ytd/shock_mode_capture.csv
  - id: ADM-2026-03-03-028
    date: 2026-03-03
    title: Deliver shock alerts in Telegram as topic episodes with multi-day aftershock continuity
    context: User requirement shifted to operational shock capture where aftershocks can occur days after root event but still belong to one tradeable theme.
    decision: Wire Telegram worker to consume shock feed with topic-aware policy (primary and aftershock roles), reopen window in hours, cooldown, and fingerprint dedupe TTL.
    impact: Worker can emit actionable shock alerts that preserve root-topic identity across days instead of treating each move as unrelated single-shot signal.
    links:
      - src/moex_carry/shock_alert_delivery.py
      - src/moex_carry/integrations/telegram_shock_broadcast.py
      - src/moex_carry/integrations/telegram_worker.py
      - tests/test_shock_alert_delivery.py
      - tests/test_telegram_worker.py
  - id: ADM-2026-03-03-029
    date: 2026-03-03
    title: Formalize shock-first ML readiness with deterministic curation and pass/fail report
    context: Existing evaluation mixed detector and direction quality, with hidden data-quality risk and no single launch decision artifact.
    decision: Add one pipeline for outlier curation, label-pack generation, label ingest, and launch-readiness checks with critical thresholds and machine-readable outputs.
    impact: Launch/no-launch decision is reproducible and auditable; critical blockers are visible immediately from report files.
    links:
