  - id: ADM-2026-03-06-091
    date: 2026-03-06
    title: Complete O1-relative execution ladder and keep O1 as baseline
    context: User requested the full `H0`-`H5` execution research program to be run end-to-end against frozen `O1`, with conclusions fixed in repo memory before the next optimization cycle.
    decision: Added a deterministic runner for the O1-relative ladder, completed `H0`-`H5` on the frozen front-nearest window, and kept `O1` as baseline because no tested candidate improved net revenue while also satisfying the same hard concentration constraint. `H1` and `H2` were noisy/inert, `H3` stop widening and `H4` RR-cap removal improved revenue but worsened concentration, `H4` absolute caps repaired concentration but destroyed too much net, and `H5` remained sensitivity-only/disallowed.
    impact: "Execution research is now narrowed to one unresolved problem: concentration-aware control of the revenue levers exposed by `sl_rr` and `max_profit_rr`. Future loops should not reopen fill-quality, break-even, trailing, or same-bar assumptions as primary axes on this frozen window."
    links:
      - scripts/run_o1_execution_hypothesis_program.py
      - artifacts/research/wf_goal_v6_h24_o1_execution_hypothesis_ladder_20260306.json
      - docs/research/o1-execution-hypothesis-results-2026-03-06.md
      - docs/session_handoff.md
      - plans/PLANS.yaml
  - id: ADM-2026-03-06-090
    date: 2026-03-06
    title: Restrict execution optimization to O1-relative economic levers and sequential family tests
    context: User clarified that the goal of execution research is larger net revenue versus baseline, and requested that conclusions about useful versus misleading levers be fixed in durable project memory before the next hypothesis loop.
    decision: Treat `O1` as the only comparison anchor, optimize first on fill-quality and trade-management levers, delay bracket-clipping levers until later, and forbid cost multipliers or same-bar policy from being used as primary optimization axes; run hypotheses one family at a time and record a verdict for each family before moving on.
    impact: "Future execution research now has a deterministic ladder: economically credible levers first, simulator-assumption levers only as sensitivity checks, and every claimed improvement must explain how it beats O1."
    links:
      - docs/research/o1-execution-hypothesis-program-2026-03-06.md
      - docs/session_handoff.md
      - plans/PLANS.yaml
