  - id: ADM-2026-03-05-083
    date: 2026-03-05
    title: Reach >=90% known-event coverage in no-lookahead walk-forward via discovery profile and rebuilt GOLD labels
    context: User target was to maximize coverage of known root events in rolling windows while keeping acceptable precision.
    decision: Introduce `discovery` vs `publish` causal profiles, enrich missing `cause_event/cause_route_key` in GOLD root rows, and calibrate walk-forward in discovery mode for coverage-first validation.
    impact: Known-event walk-forward achieved `avg_known_event_coverage=0.976` and `avg_precision=0.608` (discovery), while publish mode remains stricter for downstream Telegram filtering.
    links:
