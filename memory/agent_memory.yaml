      - scripts/run_lean_gate.py

patterns:
  - id: AMP-2026-02-20-001
    date: 2026-02-20
    title: Progressive disclosure first
    pattern: Read only the smallest set of files needed for the active step, then gate quickly.
    when_to_use: Any coding task with multi-doc instructions and potential context bloat.
    links:
      - AGENTS.md
      - docs/DEV_WORKFLOW.md
  - id: AMP-2026-02-20-002
    date: 2026-02-20
    title: No prompt-only remediation
    pattern: Any repeated failure is resolved by capability, guardrail, docs, test, or workflow updates tracked in-repo.
    when_to_use: Repeated incidents, flaky regressions, or governance drift.
    links:
      - configs/agent_incident_policy.yaml
      - docs/runbooks/self-heal-escalation.md
  - id: AMP-2026-02-20-003
    date: 2026-02-20
    title: Guardrails before parallelism
    pattern: Establish measurable resource thresholds before scaling parallel agents; stop scaling on first red signal.
    when_to_use: Any local session with two or more heavy compute agents.
    links:
      - agent-runbook.md
      - docs/checklists/first-time-right-gate.md
  - id: AMP-2026-02-20-004
    date: 2026-02-20
    title: Exclude high-churn paths from IDE indexing
    pattern: Keep dependency folders, caches, logs, and generated artifacts outside default index scope.
    when_to_use: Any repository with parallel compute agents or known local resource pressure.
    links:
      - .cursorignore
      - agent-runbook.md
  - id: AMP-2026-02-20-005
    date: 2026-02-20
    title: Quantify trigger before mitigation
    pattern: For every crash RCA, rank contributors by CPU, memory commit, and disk pressure in one time window before choosing remediation.
    when_to_use: Reboots, hangs, BSOD/live dump incidents, or any suspected multi-factor resource overload.
    links:
      - agent-runbook.md
  - id: AMP-2026-02-20-006
    date: 2026-02-20
    title: Delta-first handoff over chat recap
    pattern: Keep working state in plans/memory/session_handoff and communicate only short deltas in chat.
    when_to_use: Any multi-step task where context growth starts to slow execution or requires frequent history recomposition.
    links:
      - docs/session_handoff.md
      - docs/workflows/context-budget.md
      - docs/DEV_WORKFLOW.md
  - id: AMP-2026-02-22-007
    date: 2026-02-22
    title: Source-first verification for signal claims
    pattern: Any statement about signals must name worktree, runtime process source, and exact data path before interpreting metrics.
    when_to_use: Signal lifecycle, score-gate, telegram delivery, or data freshness investigations.
    links:
      - docs/runbooks/signal-agent-continuity.md
      - scripts/worktree_guard.ps1
  - id: AMP-2026-02-22-008
    date: 2026-02-22
    title: Gate critical trajectories as scorecard checks
    pattern: Promote key API action-path tests into quality scorecards so regressions block delivery before merge.
    when_to_use: Any user-facing flow where path correctness matters more than text output.
    links:
      - configs/quality_scorecards.yaml
      - scripts/validate_quality_scorecards.py
      - tests/test_api_v2.py
  - id: AMP-2026-02-23-009
    date: 2026-02-23
    title: Two-tier skill governance with local hard gates
    pattern: Use local and global skills together, but always apply repository baseline and validate local skills with machine checks before push.
    when_to_use: Any task where global skill guidance overlaps with repository-specific delivery workflow.
    links:
      - docs/workflows/skill-governance-sync.md
      - .cursor/skills
      - scripts/validate_skills.py
  - id: AMP-2026-02-23-010
    date: 2026-02-23
    title: Rebuild AGENTS skill map from local frontmatter after catalog sync
    pattern: After mirroring or adding skills, regenerate the `AGENTS.md` available-skill mapping from local `SKILL.md` frontmatter and re-run skill validation.
    when_to_use: Any `.cursor/skills` catalog update that changes skill count, names, or paths.
    links:
      - AGENTS.md
      - .cursor/skills
      - scripts/validate_skills.py
  - id: AMP-2026-02-23-011
    date: 2026-02-23
    title: Reference-over-duplication for governance text
    pattern: Keep skill files domain-focused and reference one centralized governance workflow instead of repeating full command lists in every skill.
    when_to_use: Any large skill-catalog update where context budget can regress due to repeated lifecycle instructions.
    links:
      - docs/workflows/skill-governance-sync.md
      - .cursor/skills
      - docs/workflows/context-budget.md
  - id: AMP-2026-02-23-012
    date: 2026-02-23
    title: API idempotency must be backed by storage uniqueness
    pattern: For any write action endpoint, require client idempotency key in contract and enforce a matching unique key at storage level.
    when_to_use: Action/execution APIs where retries, network duplicates, or multi-worker races are expected.
    links:
      - docs/contracts/api-v2.yaml
      - src/moex_carry/storage/models.py
      - src/moex_carry/storage/db.py
  - id: AMP-2026-02-23-013
    date: 2026-02-23
    title: Keep app as composition root, move behavior into focused UI services
    pattern: When API entrypoint grows, extract long-running loops and domain write flows into dedicated modules and leave route wiring in app root.
    when_to_use: Backend UI module exceeds reviewable size or combines scheduler, persistence, and route concerns in one function.
    links:
      - src/moex_carry/ui/app.py
      - src/moex_carry/ui/refresh_scheduler.py
      - src/moex_carry/ui/decision_actions.py
  - id: AMP-2026-02-23-014
    date: 2026-02-23
    title: Use hard gate plus soft target to ratchet structural debt
    pattern: Enforce one stable hard boundary for blocking checks, then track lower advisory targets and reduce overruns in small steps.
    when_to_use: Repository has legacy large modules and needs continuous multi-agent delivery without frequent exception churn.
    links:
      - configs/taste_invariants.yaml
      - scripts/validate_taste_invariants.py
      - plans/PLANS.yaml
  - id: AMP-2026-02-23-015
    date: 2026-02-23
    title: Preserve monkeypatch seams during module extraction
    pattern: When extracting logic from a large module, keep backward-compatible runtime seam points (via accessors or module-level exports) until tests and integrations migrate.
    when_to_use: Route/service decomposition where existing tests patch module globals or dynamic imports rely on legacy symbols.
    links:
      - src/moex_carry/ui/app.py
      - src/moex_carry/ui/routes_pretrade.py
      - tests/test_api_v2.py
      - tests/test_ui_api.py
  - id: AMP-2026-02-23-016
    date: 2026-02-23
    title: Keep route-parity and baseline scanners aligned with multi-file route extraction
    pattern: Any time API routes are moved out of `ui/app.py`, update parity and baseline metric scanners to aggregate all UI route modules.
    when_to_use: Incremental decomposition of Flask route groups into registrar modules.
    links:
      - scripts/validate_api_v2_contract_parity.py
      - scripts/harness_baseline_metrics.py
      - src/moex_carry/ui/routes_market_data.py
  - id: AMP-2026-02-23-017
    date: 2026-02-23
    title: Reuse legacy module runtime callables during registrar extraction
    pattern: Keep extracted route modules pure on wiring, but resolve runtime callables through the legacy module when tests monkeypatch that module directly.
    when_to_use: Flask route decomposition where regression tests patch `ui.app` symbols such as backtest/HPO runtime entrypoints.
    links:
      - src/moex_carry/ui/routes_research.py
      - src/moex_carry/ui/app.py
      - tests/test_api_v2.py
  - id: AMP-2026-03-02-018
    date: 2026-03-02
    title: Review components in operator journey order before expanding requirements
    pattern: Start from workspace entry, then walk decisions, actions, research, news, portfolio, and ops, documenting primary/edge/negative/interruption scenarios per component.
    when_to_use: Product or BA tasks aimed at maximizing use-case coverage and reducing hidden workflow gaps.
    links:
      - docs/planning/user-needs-catalog.md
      - docs/user-scenarios.md
      - docs/checklists/first-time-right-gate.md
  - id: AMP-2026-03-02-019
    date: 2026-03-02
    title: Re-pin editable install to active worktree before running tests
    pattern: After switching worktrees, verify `moex_carry.__file__` path and run `python -m pip install -e .` if imports still point to another checkout.
    when_to_use: Test runs unexpectedly ignore local patches after worktree/branch switch in a shared Python environment.
    links:
      - pyproject.toml
      - docs/DEV_WORKFLOW.md
      - memory/agent_memory.yaml
  - id: AMP-2026-03-03-020
    date: 2026-03-03
    title: Evaluate news-linking changes with precision-at-coverage, not single scalar score
    pattern: For shock-to-news matching, always report at least coverage, labeled directional accuracy, and relevance quality together, then add threshold sweep with minimum coverage constraint.
    when_to_use: Any tuning of strict vs broad candidate selection where naive high-precision or high-coverage settings can look misleading in isolation.
    links:
      - src/moex_carry/news_mode_compare.py
      - scripts/compare_news_modes.py
      - data/output/news_mode_compare_365d_5m_opt/news_mode_compare_sweep.csv
  - id: AMP-2026-03-03-021
    date: 2026-03-03
    title: Measure shock-capture quality by role (primary vs aftershock)
    pattern: Compute and track recall for initial shock impulse and follow-up aftershock legs separately; use primary recall for detector tuning and aftershock recall for continuation logic.
    when_to_use: Any shock-detection strategy where continuation bursts are materially different from root impulse behavior.
    links:
      - src/moex_carry/shock_episodes.py
      - scripts/analyze_shock_episodes.py
      - data/output/shock_episode_analysis_2026_ytd/shock_mode_capture.csv
  - id: AMP-2026-03-03-022
    date: 2026-03-03
    title: Keep oversized runtime modules within hard limits by extracting leaf capabilities
    pattern: When a hard size gate blocks integration, extract feature-specific runtime paths into dedicated modules and keep composition entrypoint thin.
    when_to_use: Any worker or API composition module near hard line cap where a new capability must be added without loosening governance limits.
    links:
      - src/moex_carry/integrations/telegram_worker.py
      - src/moex_carry/integrations/telegram_shock_broadcast.py
      - src/moex_carry/integrations/telegram_runtime_utils.py
  - id: AMP-2026-03-03-023
    date: 2026-03-03
    title: Split shock workflow into detector and direction quality lanes
    pattern: Keep high-recall detector broad enough for root shock capture, but compute direction quality only on stricter source (`v2_clean`) and gate it by labeled accuracy and coverage.
    when_to_use: Shock-driven news systems where broad matching improves recall but harms directional precision.
    links:
      - src/moex_carry/news_mode_compare.py
      - src/moex_carry/news_shock_readiness.py
      - docs/runbooks/news-shock-go-live.md
  - id: AMP-2026-03-03-024
    date: 2026-03-03
    title: Automate silver expansion with split directional and causal packs
    pattern: Build two packs from one curated dataset each day, where directional tasks use `v2_clean` and causal-only tasks use `broad/none`, then track results through one manifest.
    when_to_use: Any annotation cycle where direction labels need high precision but causal coverage must scale quickly without manual triage.
    links:
      - src/moex_carry/news_shock_automation.py
      - scripts/run_shock_label_cycle.py
      - src/moex_carry/news_shock_pipeline.py
      - docs/runbooks/news-shock-go-live.md
  - id: AMP-2026-03-03-025
    date: 2026-03-03
    title: Use user-context scheduled task for unattended local ML/news jobs
    pattern: For workstation automation, install Task Scheduler jobs under current user by default and keep SYSTEM mode optional for elevated deployments.
    when_to_use: Any recurring local research/labeling pipeline that must run daily without manual CLI launch and without admin-only setup.
    links:
      - scripts/manage_shock_label_cycle_task.ps1
      - scripts/start_shock_label_cycle.ps1
      - docs/runbooks/news-shock-go-live.md
  - id: AMP-2026-03-03-026
    date: 2026-03-03
    title: Keep Telegram shock feed as rolling canonical CSV plus per-run snapshot
    pattern: Write a stable rolling path for runtime consumers and also persist per-run snapshot artifact for auditability and rollback-safe comparisons.
    when_to_use: Any batch workflow that feeds a live notifier and also needs reproducible run artifacts.
    links:
      - src/moex_carry/news_shock_automation.py
      - data/output/shock_alerts/live_shocks.csv
      - docs/runbooks/news-shock-go-live.md
  - id: AMP-2026-03-03-027
    date: 2026-03-03
    title: Split shock automation into frequent fresh and daily backfill schedules
    pattern: Run a short lookback repeating task for live alerts and a separate daily deep task for coverage growth; keep backfill from overwriting live Telegram feed.
    when_to_use: Any news/shock pipeline with strict daily API quotas where live latency and historical recall must coexist.
    links:
      - scripts/manage_news_shock_live_plan.ps1
      - scripts/manage_shock_label_cycle_task.ps1
      - scripts/start_shock_label_cycle.ps1
      - src/moex_carry/news_shock_automation.py
  - id: AMP-2026-03-04-028
    date: 2026-03-04
    title: Reject under-specified requests before coding
    pattern: Define and validate objective/scope/constraints/done-evidence/priority rule in handoff before implementation; stop and request clarification when any field is missing.
    when_to_use: Any non-trivial task where implicit assumptions can cause rework or hidden scope drift.
    links:
      - docs/checklists/task-request-contract.md
      - scripts/validate_task_request_contract.py
      - docs/session_handoff.md
      - docs/DEV_WORKFLOW.md
  - id: AMP-2026-03-04-029
    date: 2026-03-04
    title: Force loop-breaker reset after repeated same-path failures
    pattern: Cap same-path attempts, stop on repeated failure signature, execute context reset, and run one falsifiable probe from a new search space before further patching.
    when_to_use: Any recurring bug/incident where fixes repeat without changing failure mode.
    links:
      - configs/agent_incident_policy.yaml
      - scripts/validate_agent_memory.py
      - scripts/validate_task_request_contract.py
      - docs/session_handoff.md
      - .cursor/skills/repeated-issue-review/SKILL.md
  - id: AMP-2026-03-04-030
    date: 2026-03-04
    title: Keep external-practice adoption explicit with per-advice decision traceability
    pattern: For each external recommendation, record usefulness and decision (`ADOPT/ADAPT/DEFER/REJECT`) against architecture and active governance gates before implementing changes.
    when_to_use: Any methodology import where generic advice may conflict with repository-specific safety, risk, or delivery constraints.
    links:
      - docs/workflows/external-advice-mapping-2026-03-04.md
      - docs/workflows/agent-practices-alignment.md
      - plans/PLANS.yaml
  - id: AMP-2026-03-05-031
    date: 2026-03-05
    title: Convert non-blocking governance warnings into explicit follow-up tasks
    pattern: When validators emit advisory/non-blocking findings, record one concrete follow-up in `plans/PLANS.yaml` and link rationale in `memory/agent_memory.yaml` to avoid repeating the same warning without ownership.
    when_to_use: Any run where lean gate passes but advisories recur across sessions.
    links:
      - docs/runbooks/governance-remediation.md
      - plans/PLANS.yaml
      - memory/agent_memory.yaml
  - id: AMP-2026-03-05-032
    date: 2026-03-05
    title: Make time-window tests explicit about evaluation clock
    pattern: Any logic with lookback/time-cutoff gates should accept optional as-of timestamp and tests should pass fixed as-of values instead of relying on datetime.now().
    when_to_use: Filtering, gating, or ranking code where fixture timestamps can drift outside windows as real time advances.
    links:
      - src/moex_carry/news_live_bridge.py
      - tests/test_news_live_runtime.py
      - docs/checklists/first-time-right-gate.md

