version: 1
updated_at: 2026-03-02

decisions:
  - id: ADM-2026-02-20-001
    date: 2026-02-20
    title: Introduce lean governance gate as single fast loop
    context: High context usage and fragmented checks slowed agent iteration.
    decision: Consolidate governance checks into scripts/run_lean_gate.py and route CI/pre-push through it.
    impact: Lower orchestration overhead, deterministic feedback loop, easier agent reuse.
    links:
      - scripts/run_lean_gate.py
      - .github/workflows/ci.yml
      - .githooks/pre-push
  - id: ADM-2026-02-20-002
    date: 2026-02-20
    title: Convert remaining partial governance gaps into enforceable repository checks
    context: Partial Harness alignment remained in ADR policy, flaky handling, e2e CI, observability setup, and NFR journey budgets.
    decision: Add explicit policies plus validators and CI gates instead of relying on informal guidance.
    impact: Reduced prompt-dependence and stronger machine-verifiable governance across delivery flows.
    links:
      - scripts/validate_dependency_decisions.py
      - scripts/validate_flaky_policy.py
      - scripts/validate_taste_invariants.py
      - scripts/validate_observability_stack.py
      - .github/workflows/ci.yml
  - id: ADM-2026-02-20-003
    date: 2026-02-20
    title: Prefer minimatch override plus ESLint 9 compatibility for ui-web audit remediation
    context: Upgrading to ESLint 10 introduced peer conflicts while high audit findings were rooted in minimatch.
    decision: Keep ESLint on 9.x and pin minimatch 10.2.2 via overrides in ui-web dependencies.
    impact: Removed high/critical findings with minimal frontend linting disruption.
    links:
      - ui-web/package.json
      - ui-web/package-lock.json
      - docs/architecture/adr/0002-ui-web-audit-remediation-eslint-chain.md
  - id: ADM-2026-02-20-004
    date: 2026-02-20
    title: Introduce explicit multi-agent load guardrails via runbook
    context: Repeated hard resets and mixed kernel failures appeared under parallel high-load agent sessions.
    decision: Add a dedicated runtime runbook with strict launch gates and stop/replan thresholds for CPU, memory commit, and disk pressure.
    impact: Lower probability of commit-limit exhaustion and unstable mixed compute plus driver behavior.
    links:
      - agent-runbook.md
      - plans/PLANS.yaml
  - id: ADM-2026-02-20-005
    date: 2026-02-20
    title: Limit Cursor indexing scope with repository-level .cursorignore
    context: Crash-window telemetry showed high-churn indexing and retrieval activity during heavy parallel workloads.
    decision: Add .cursorignore to exclude generated and dependency-heavy paths from indexing by default.
    impact: Lower background CPU and disk pressure; reduced probability of commit-limit amplification from concurrent indexing.
    links:
      - .cursorignore
      - agent-runbook.md
  - id: ADM-2026-02-20-006
    date: 2026-02-20
    title: Make load-source attribution mandatory in incident RCA
    context: Prior incidents could be misread when a single process looked small versus system-wide commit and I/O pressure.
    decision: Extend runbook with a mandatory RCA block that quantifies timeline, top contributors, and trigger versus amplifier roles.
    impact: Faster and more reliable identification of true overload source, with action thresholds tied to measurable metrics.
    links:
      - agent-runbook.md
      - plans/PLANS.yaml
  - id: ADM-2026-02-20-007
    date: 2026-02-20
    title: Enforce context budget with versioned handoff and lean-gate validator
    context: Team discussion identified repeated context bloat from long chat recaps and duplicated instruction payloads.
    decision: Introduce `docs/session_handoff.md` + `docs/workflows/context-budget.md` and validate with `scripts/validate_session_handoff.py` in lean gate.
    impact: Team handoff becomes short and deterministic; context continuity moves from chat history to repository artifacts.
    links:
      - docs/session_handoff.md
      - docs/workflows/context-budget.md
      - scripts/validate_session_handoff.py
      - scripts/run_lean_gate.py
  - id: ADM-2026-02-20-008
    date: 2026-02-20
    title: Make PR-only main flow enforceable with explicit emergency override reason
    context: A direct merge to `main` bypassed PR review trail even though local gates passed.
    decision: Harden pre-push to block direct `main` pushes by default and require a reasoned emergency override; add repo validators to keep policy docs and hooks aligned.
    impact: PR review path becomes default and mechanically enforced; emergency bypass remains auditable.
    links:
      - .githooks/pre-push
      - scripts/validate_pr_only_policy.py
      - docs/DEV_WORKFLOW.md
      - AGENTS.md
  - id: ADM-2026-02-22-009
    date: 2026-02-22
    title: Standardize signal continuity documentation around worktree and data-layer contracts
    context: Repeated troubleshooting loops showed the same failures around wrong worktree, stale projection files, and mixed metric semantics.
    decision: Add a dedicated runbook that defines canonical paths, signal semantics, and mandatory verification flow for signal-related changes.
    impact: Faster root-cause isolation, fewer false regressions, and stable handoffs across sessions and worktrees.
    links:
      - docs/runbooks/signal-agent-continuity.md
      - docs/session_handoff.md
  - id: ADM-2026-02-22-010
    date: 2026-02-22
    title: Add trajectory scorecard gates and deterministic API request id propagation
    context: Main local risks were scenario regressions, non-repeatable failures, and excessive request payloads.
    decision: Extend quality scorecards with trajectory and context-budget dimensions; add API v2 request id propagation and payload-size guard.
    impact: Critical action flows are regression-gated; every v2 response is traceable by request id; oversized requests fail fast.
    links:
      - configs/quality_scorecards.yaml
      - src/moex_carry/ui/app.py
      - tests/test_api_v2.py
  - id: ADM-2026-02-23-011
    date: 2026-02-23
    title: Treat local and global skills as one catalog with repository governance precedence
    context: Team workflows use many global skills, while repository gates only validated local `.cursor/skills` and drift appeared in governance instructions.
    decision: Add explicit combined-catalog workflow, sync all local skills to one governance baseline block, and enforce markers in `scripts/validate_skills.py`.
    impact: Skill selection now remains broad while repository guardrails stay deterministic and machine-checked for every local skill update.
    links:
      - docs/workflows/skill-governance-sync.md
      - AGENTS.md
      - docs/DEV_WORKFLOW.md
      - scripts/validate_skills.py
  - id: ADM-2026-02-23-012
    date: 2026-02-23
    title: Mirror global skill catalog into repository-local `.cursor/skills`
    context: Team requested always accounting for global and local skills together while keeping repository validation deterministic.
    decision: Copy global skills into `.cursor/skills`, normalize lifecycle and governance baseline markers, and refresh `AGENTS.md` from local skill metadata.
    impact: Skill discovery no longer depends on external home directory state; repository-local catalog is complete and machine-validated.
    links:
      - .cursor/skills
      - AGENTS.md
      - docs/workflows/skill-governance-sync.md
      - scripts/validate_skills.py
  - id: ADM-2026-02-23-013
    date: 2026-02-23
    title: Centralize skill governance details to control context size
    context: Mirroring all skills locally increased repetitive governance text and AGENTS payload size.
    decision: Replace per-skill command catalogs with a short baseline reference to docs/workflows/skill-governance-sync.md and keep AGENTS skill entries compact.
    impact: Lower per-turn prompt overhead while preserving deterministic governance checks through centralized docs and validator rules.
    links:
      - docs/workflows/skill-governance-sync.md
      - scripts/validate_skills.py
      - AGENTS.md
  - id: ADM-2026-02-23-014
    date: 2026-02-23
    title: Automate skill scope decision
    context: Repeated questions appeared about whether repeated problems require updating existing skills or adding a new one.
    decision: Add `scripts/skill_update_decision.py` and wire it into skill governance workflow, AGENTS, and DEV workflow as a pre-edit decision gate.
    impact: Routing between existing-skill updates and new skill creation became machine-supported and repeatable.
    links:
      - scripts/skill_update_decision.py
      - docs/workflows/skill-governance-sync.md
      - AGENTS.md
      - docs/DEV_WORKFLOW.md
  - id: ADM-2026-02-23-015
    date: 2026-02-23
    title: Enforce skill decision on commit
    context: Even after pre-edit routing, commits with skill edits could bypass decision checks.
    decision: Add `scripts/skill_precommit_gate.py` and `.githooks/pre-commit` to run `skill_update_decision` for staged skill/governance files.
    impact: Introduced a commit-time guard that blocks `NO_CHANGE` ambiguous edits unless explicitly scoped.
    links:
      - .githooks/pre-commit
      - scripts/skill_precommit_gate.py
      - docs/workflows/skill-governance-sync.md
      - AGENTS.md
  - id: ADM-2026-02-23-016
    date: 2026-02-23
    title: Route AI work by bounded ownership contexts and surface route at task start
    context: Project scope growth increased agent context size and cross-module edit risk.
    decision: Add a CTX-based context map plus a deterministic file router and invoke it automatically from worktree_guard check.
    impact: Start-of-task flow now shows patch scope and risk early, reducing unnecessary file loading and mixed-concern edits.
    links:
      - docs/agent-contexts/README.md
      - scripts/context_router.py
      - scripts/worktree_guard.ps1
  - id: ADM-2026-02-23-017
    date: 2026-02-23
    title: Require idempotency keys and scheduler lease for action/execution stability
    context: Architecture review identified duplicate action risk and multi-worker scheduler races in API runtime.
    decision: Make idempotency_key mandatory for write actions, enforce pair+idempotency uniqueness in signal execution storage, and gate refresh scheduler with a runtime lease singleton.
    impact: Lower duplicate execution risk under retries/concurrency; predictable refresh behavior in multi-worker deployment.
    links:
      - docs/contracts/api-v2.yaml
      - src/moex_carry/ui/app.py
      - src/moex_carry/storage/db.py
      - src/moex_carry/storage/repositories.py
  - id: ADM-2026-02-23-018
    date: 2026-02-23
    title: Split UI composition by extracting scheduler and decision-action service
    context: "`ui/app.py` concentrated routing, background scheduler loop, and decision-action write logic in one file."
    decision: "Extract scheduler lease loop to `ui/refresh_scheduler.py` and decision action handling to `ui/decision_actions.py`, keeping `app.py` as composition root."
    impact: Lower blast radius for route/scheduler changes and cleaner ownership boundaries inside the UI backend package.
    links:
      - src/moex_carry/ui/app.py
      - src/moex_carry/ui/refresh_scheduler.py
      - src/moex_carry/ui/decision_actions.py
      - docs/architecture/modules/backend-core.md
  - id: ADM-2026-02-23-019
    date: 2026-02-23
    title: Separate hard and target file-size budgets for agent-friendly decomposition
    context: A single hard line-limit either forced many exceptions or blocked incremental decomposition of large legacy modules.
    decision: Keep hard gate at `max_lines_default=800` with focused `allowed_large_files`, and add non-blocking `target_lines_default` plus `target_large_files` advisory budgets.
    impact: Exception list stays small for true outliers, while teams get an explicit ratchet target without breaking delivery flow.
    links:
      - configs/taste_invariants.yaml
      - scripts/validate_taste_invariants.py
      - docs/runbooks/governance-remediation.md
      - plans/PLANS.yaml
  - id: ADM-2026-02-23-020
    date: 2026-02-23
    title: Decompose UI API by route-group registrars while preserving monkeypatch seams
    context: "`ui/app.py` still contained large operational and pretrade route groups, and existing tests monkeypatch symbols on `ui.app`."
    decision: "Move ops and pretrade endpoints into `ui/routes_ops.py` and `ui/routes_pretrade.py`, but keep `MoexIssClient` and `run_delay_gate` resolved from `ui.app` via accessor hooks."
    impact: Reduced app composition size and improved route ownership boundaries without breaking testability or endpoint behavior contracts.
    links:
      - src/moex_carry/ui/app.py
      - src/moex_carry/ui/routes_ops.py
      - src/moex_carry/ui/routes_pretrade.py
      - tests/test_api_v2.py
      - tests/test_ui_api.py
  - id: ADM-2026-02-23-021
    date: 2026-02-23
    title: Group read-heavy market and portfolio routes under dedicated registrar
    context: "`ui/app.py` still carried signal history/execution read APIs, spread-series, and portfolio rebalance endpoints in one large block."
    decision: "Extract these endpoints to `ui/routes_market_data.py` and wire from composition root, preserving `ui.app.build_spread_series` seam via accessor callback."
    impact: Further reduced UI composition root size and isolated read/preview API behavior into a focused module without changing route contracts.
    links:
      - src/moex_carry/ui/app.py
      - src/moex_carry/ui/routes_market_data.py
      - scripts/validate_api_v2_contract_parity.py
      - scripts/harness_baseline_metrics.py
      - tests/test_signal_api.py
      - tests/test_ui_api.py
  - id: ADM-2026-02-23-022
    date: 2026-02-23
    title: Extract v2 research wrappers while preserving ui.app monkeypatch points
    context: "`ui/app.py` still included `/api/v2/research/*` wrappers and kept growing despite earlier route-group decomposition."
    decision: "Move research wrappers to `ui/routes_research.py`, register from composition root, and resolve runtime backtest/HPO callables through `moex_carry.ui.app` for test seam compatibility."
    impact: Reduced app composition size and unblocked next extraction of action/actionability routes without regressing research endpoint behavior.
    links:
      - src/moex_carry/ui/app.py
      - src/moex_carry/ui/routes_research.py
      - tests/test_api_v2.py
      - docs/architecture/modules/backend-core.md
  - id: ADM-2026-03-02-023
    date: 2026-03-02
    title: Use component-first scenario review as product documentation baseline
    context: Existing artifacts covered endpoints and modules well, but user journeys were not consistently reviewed in component order with edge/negative/interruption paths.
    decision: Update planning and scenario docs with a sequential component walkthrough and explicit high-priority risk gaps.
    impact: Product and engineering now share one review frame for operator journeys, making coverage gaps visible before implementation.
    links:
      - docs/planning/user-needs-catalog.md
      - docs/user-scenarios.md
      - docs/planning/product-decisions.md
      - docs/ux/workspaces-map.md

  - id: ADM-2026-03-02-024
    date: 2026-03-02
    title: Close review-derived operator safety gaps in the same iteration
    context: Component-first review surfaced contract-critical write-path and risk-gate gaps that were still open in UI/backend behavior.
    decision: Implement idempotency payload generation in UI write actions, enforce server-side rebalance commit risk gate, and add forward start action in Research workspace without delaying to a separate sprint.
    impact: Reduced duplicate-write and unsafe-commit risk immediately after discovery; operator flow now covers forward run start and status in one UI path.
    links:
      - ui-web/src/features/market/useMarketTables.ts
      - ui-web/src/features/decisions/useDecisionView.ts
      - src/moex_carry/ui/routes_market_data.py
      - ui-web/src/features/forward/ForwardTab.tsx
incidents:
  - id: AMI-2026-02-20-001
    date: 2026-02-20
    title: Worktree drift during edits
    symptom: Early edits were applied to a different checkout path and had to be re-synced.
    root_cause: Missing immediate cwd verification before patch phase.
    remediation: Enforce worktree_guard check at task start and before major edit batches.
    remediation_type: guardrail
    links:
      - scripts/worktree_guard.ps1
  - id: AMI-2026-02-20-002
    date: 2026-02-20
    title: EPERM lock on esbuild/rollup binaries during npm ci
    symptom: npm cleanup failed to unlink binary files under ui-web/node_modules on Windows.
    root_cause: Background vite/esbuild processes held file handles during reinstall.
    remediation: Stop vite/esbuild processes before reinstall and continue with npm install when ci unlink fails.
    remediation_type: workflow
    links:
      - docs/DEV_WORKFLOW.md
      - ui-web/package-lock.json
  - id: AMI-2026-02-20-003
    date: 2026-02-20
    title: Hard reboot under high multi-agent memory commit pressure
    symptom: Unexpected reboot and hangs with mixed BSOD and live-kernel events during parallel agent workloads.
    root_cause: Near-limit commit pressure amplified by concurrent heavy agents plus unstable low-level utility and driver interactions.
    remediation: Standardize launch gates, concurrency limits, and stop/replan thresholds in a dedicated runbook.
    remediation_type: guardrail
    links:
      - agent-runbook.md
      - memory/agent_memory.yaml
  - id: AMI-2026-02-20-004
    date: 2026-02-20
    title: Cursor indexing storm during parallel agent execution
    symptom: Spikes of pending documents, forced index resets, and repeated sync cycles during heavy sessions.
    root_cause: Background indexing scope included high-churn generated paths while compute agents were active.
    remediation: Exclude generated paths with .cursorignore and avoid concurrent heavy indexing with three heavy agents.
    remediation_type: guardrail
    links:
      - .cursorignore
      - agent-runbook.md
  - id: AMI-2026-02-22-005
    date: 2026-02-22
    title: Repeated signal verification loops due to projection/file/source mismatch
    symptom: Same signal questions re-opened because outputs differed between branches, runtime processes, and file paths.
    root_cause: Checks mixed `data/output/*`, `data/output/unified/*`, and live API state without explicit source contract.
    remediation: Document and enforce canonical source order and verification checklist in a dedicated signal continuity runbook.
    remediation_type: docs
    links:
      - docs/runbooks/signal-agent-continuity.md
      - docs/session_handoff.md
  - id: AMI-2026-02-23-006
    date: 2026-02-23
    title: Telegram worker cycle spammed errors on transient long-poll disconnects
    symptom: "Worker logged Telegram worker cycle failed stack traces when Telegram closed getUpdates connections without response."
    root_cause: "_fetch_updates treated transient transport and retryable HTTP failures as fatal instead of bounded-retry/no-op cycles."
    remediation: "Add one bounded retry for getUpdates, degrade to empty update batch on repeated transient failure, and lock behavior with tests."
    remediation_type: capability
    links:
      - src/moex_carry/integrations/telegram_worker.py
      - tests/test_telegram_worker.py
  - id: AMI-2026-02-23-007
    date: 2026-02-23
    title: Editable package path drifted to another worktree during architecture patch validation
    symptom: Pytest in a new worktree imported moex_carry from a different checkout path and missed new repository symbols.
    root_cause: Local editable install still pointed to previous worktree after branch/worktree switch.
    remediation: Reinstall editable package from active worktree before running tests.
    remediation_type: workflow
    links:
      - pyproject.toml
      - docs/DEV_WORKFLOW.md

patterns:
  - id: AMP-2026-02-20-001
    date: 2026-02-20
    title: Progressive disclosure first
    pattern: Read only the smallest set of files needed for the active step, then gate quickly.
    when_to_use: Any coding task with multi-doc instructions and potential context bloat.
    links:
      - AGENTS.md
      - docs/DEV_WORKFLOW.md
  - id: AMP-2026-02-20-002
    date: 2026-02-20
    title: No prompt-only remediation
    pattern: Any repeated failure is resolved by capability, guardrail, docs, test, or workflow updates tracked in-repo.
    when_to_use: Repeated incidents, flaky regressions, or governance drift.
    links:
      - configs/agent_incident_policy.yaml
      - docs/runbooks/self-heal-escalation.md
  - id: AMP-2026-02-20-003
    date: 2026-02-20
    title: Guardrails before parallelism
    pattern: Establish measurable resource thresholds before scaling parallel agents; stop scaling on first red signal.
    when_to_use: Any local session with two or more heavy compute agents.
    links:
      - agent-runbook.md
      - docs/checklists/first-time-right-gate.md
  - id: AMP-2026-02-20-004
    date: 2026-02-20
    title: Exclude high-churn paths from IDE indexing
    pattern: Keep dependency folders, caches, logs, and generated artifacts outside default index scope.
    when_to_use: Any repository with parallel compute agents or known local resource pressure.
    links:
      - .cursorignore
      - agent-runbook.md
  - id: AMP-2026-02-20-005
    date: 2026-02-20
    title: Quantify trigger before mitigation
    pattern: For every crash RCA, rank contributors by CPU, memory commit, and disk pressure in one time window before choosing remediation.
    when_to_use: Reboots, hangs, BSOD/live dump incidents, or any suspected multi-factor resource overload.
    links:
      - agent-runbook.md
  - id: AMP-2026-02-20-006
    date: 2026-02-20
    title: Delta-first handoff over chat recap
    pattern: Keep working state in plans/memory/session_handoff and communicate only short deltas in chat.
    when_to_use: Any multi-step task where context growth starts to slow execution or requires frequent history recomposition.
    links:
      - docs/session_handoff.md
      - docs/workflows/context-budget.md
      - docs/DEV_WORKFLOW.md
  - id: AMP-2026-02-22-007
    date: 2026-02-22
    title: Source-first verification for signal claims
    pattern: Any statement about signals must name worktree, runtime process source, and exact data path before interpreting metrics.
    when_to_use: Signal lifecycle, score-gate, telegram delivery, or data freshness investigations.
    links:
      - docs/runbooks/signal-agent-continuity.md
      - scripts/worktree_guard.ps1
  - id: AMP-2026-02-22-008
    date: 2026-02-22
    title: Gate critical trajectories as scorecard checks
    pattern: Promote key API action-path tests into quality scorecards so regressions block delivery before merge.
    when_to_use: Any user-facing flow where path correctness matters more than text output.
    links:
      - configs/quality_scorecards.yaml
      - scripts/validate_quality_scorecards.py
      - tests/test_api_v2.py
  - id: AMP-2026-02-23-009
    date: 2026-02-23
    title: Two-tier skill governance with local hard gates
    pattern: Use local and global skills together, but always apply repository baseline and validate local skills with machine checks before push.
    when_to_use: Any task where global skill guidance overlaps with repository-specific delivery workflow.
    links:
      - docs/workflows/skill-governance-sync.md
      - .cursor/skills
      - scripts/validate_skills.py
  - id: AMP-2026-02-23-010
    date: 2026-02-23
    title: Rebuild AGENTS skill map from local frontmatter after catalog sync
    pattern: After mirroring or adding skills, regenerate the `AGENTS.md` available-skill mapping from local `SKILL.md` frontmatter and re-run skill validation.
    when_to_use: Any `.cursor/skills` catalog update that changes skill count, names, or paths.
    links:
      - AGENTS.md
      - .cursor/skills
      - scripts/validate_skills.py
  - id: AMP-2026-02-23-011
    date: 2026-02-23
    title: Reference-over-duplication for governance text
    pattern: Keep skill files domain-focused and reference one centralized governance workflow instead of repeating full command lists in every skill.
    when_to_use: Any large skill-catalog update where context budget can regress due to repeated lifecycle instructions.
    links:
      - docs/workflows/skill-governance-sync.md
      - .cursor/skills
      - docs/workflows/context-budget.md
  - id: AMP-2026-02-23-012
    date: 2026-02-23
    title: API idempotency must be backed by storage uniqueness
    pattern: For any write action endpoint, require client idempotency key in contract and enforce a matching unique key at storage level.
    when_to_use: Action/execution APIs where retries, network duplicates, or multi-worker races are expected.
    links:
      - docs/contracts/api-v2.yaml
      - src/moex_carry/storage/models.py
      - src/moex_carry/storage/db.py
  - id: AMP-2026-02-23-013
    date: 2026-02-23
    title: Keep app as composition root, move behavior into focused UI services
    pattern: When API entrypoint grows, extract long-running loops and domain write flows into dedicated modules and leave route wiring in app root.
    when_to_use: Backend UI module exceeds reviewable size or combines scheduler, persistence, and route concerns in one function.
    links:
      - src/moex_carry/ui/app.py
      - src/moex_carry/ui/refresh_scheduler.py
      - src/moex_carry/ui/decision_actions.py
  - id: AMP-2026-02-23-014
    date: 2026-02-23
    title: Use hard gate plus soft target to ratchet structural debt
    pattern: Enforce one stable hard boundary for blocking checks, then track lower advisory targets and reduce overruns in small steps.
    when_to_use: Repository has legacy large modules and needs continuous multi-agent delivery without frequent exception churn.
    links:
      - configs/taste_invariants.yaml
      - scripts/validate_taste_invariants.py
      - plans/PLANS.yaml
  - id: AMP-2026-02-23-015
    date: 2026-02-23
    title: Preserve monkeypatch seams during module extraction
    pattern: When extracting logic from a large module, keep backward-compatible runtime seam points (via accessors or module-level exports) until tests and integrations migrate.
    when_to_use: Route/service decomposition where existing tests patch module globals or dynamic imports rely on legacy symbols.
    links:
      - src/moex_carry/ui/app.py
      - src/moex_carry/ui/routes_pretrade.py
      - tests/test_api_v2.py
      - tests/test_ui_api.py
  - id: AMP-2026-02-23-016
    date: 2026-02-23
    title: Keep route-parity and baseline scanners aligned with multi-file route extraction
    pattern: Any time API routes are moved out of `ui/app.py`, update parity and baseline metric scanners to aggregate all UI route modules.
    when_to_use: Incremental decomposition of Flask route groups into registrar modules.
    links:
      - scripts/validate_api_v2_contract_parity.py
      - scripts/harness_baseline_metrics.py
      - src/moex_carry/ui/routes_market_data.py
  - id: AMP-2026-02-23-017
    date: 2026-02-23
    title: Reuse legacy module runtime callables during registrar extraction
    pattern: Keep extracted route modules pure on wiring, but resolve runtime callables through the legacy module when tests monkeypatch that module directly.
    when_to_use: Flask route decomposition where regression tests patch `ui.app` symbols such as backtest/HPO runtime entrypoints.
    links:
      - src/moex_carry/ui/routes_research.py
      - src/moex_carry/ui/app.py
      - tests/test_api_v2.py
