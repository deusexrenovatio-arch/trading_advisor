  - id: ADM-2026-03-06-092
    date: 2026-03-06
    title: Require whole-universe, no-dominant-top, and per-root diagnostics for execution research
    context: User clarified that aggregate concentration alone is not enough to judge regime quality and that future execution conclusions must stay valid both with dominant tops included and with them removed.
    decision: Keep the whole-universe result as the primary view, but whenever concentration is material add a supplemental no-dominant-top diagnostic and report quality per root or instrument before calling an uplift structural.
    impact: Future execution reviews must explain whether a candidate survives removal of dominant contributors and which roots actually carry the quality, instead of relying on aggregate net alone.
